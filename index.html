<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>솔안과 근무표</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style id="app-style">/* layout: app bar (clinic, month, login, save) + team bar under the clinic name; numbered tabs by role; the roster grid is the working surface and scrolls sideways inside its own frame */
:root{
  --bg:#F2F5F3;--surface:#FFFFFF;--surface-2:#EAF0ED;--ink:#17211E;--ink-2:#3A4642;--muted:#64716C;--line:#D8E0DC;
  --accent:#1C6A56;--accent-ink:#FFFFFF;--accent-soft:#DCEEE7;--work-ink:#155240;
  --sat:#2352B0;--sun:#C2392D;--leave:#94600A;--leave-soft:#FAEDD2;--night:#3B468E;--night-soft:#E3E5F6;
  --pref:#B1356D;--danger:#C2392D;--danger-soft:#FBE2DE;--warn:#94600A;--warn-soft:#FAEDD2;--hatch:rgba(23,33,30,.07);
  --cu-blue-bg:#DDE8FA;--cu-blue-fg:#1F4E9C;--cu-violet-bg:#ECE2F7;--cu-violet-fg:#5A3590;--cu-rose-bg:#F8DFE6;--cu-rose-fg:#982B4A;
  --cu-cyan-bg:#D6EEF4;--cu-cyan-fg:#105D70;--cu-lime-bg:#E7EFD0;--cu-lime-fg:#4C5E12;--cu-slate-bg:#E3E7EA;--cu-slate-fg:#3D4A55;
  --dayhead:#FCE7DA;--titleband:#FFF200;--titleink:#17211E;--sec-night:#2352B0;--sec-leave:#A86A00;--sec-etc:#3B7A2A;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412;--surface:#151D1A;--surface-2:#1B2521;--ink:#E2EAE7;--ink-2:#C0CCC7;--muted:#8D9B96;--line:#28342F;
  --accent:#58BD9C;--accent-ink:#0B1914;--accent-soft:#19382E;--work-ink:#A6E0CC;
  --sat:#84A7F1;--sun:#EF867B;--leave:#E4AE4C;--leave-soft:#392C13;--night:#A2ABF1;--night-soft:#24294B;
  --pref:#EC85B4;--danger:#EF867B;--danger-soft:#3C1E1B;--warn:#E4AE4C;--warn-soft:#392C13;--hatch:rgba(226,234,231,.06);
  --cu-blue-bg:#1D2D4A;--cu-blue-fg:#9EBEF2;--cu-violet-bg:#2E2442;--cu-violet-fg:#C9B2EE;--cu-rose-bg:#3E1E28;--cu-rose-fg:#F0A6BC;
  --cu-cyan-bg:#143440;--cu-cyan-fg:#8ED4E4;--cu-lime-bg:#283019;--cu-lime-fg:#C3D387;--cu-slate-bg:#252C31;--cu-slate-fg:#B7C2CB;--dayhead:#3A2B22;--titleband:#4A4517;--titleink:#F4F0C8;--sec-night:#93B4F4;--sec-leave:#E7B355;--sec-etc:#9BD383;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412;--surface:#151D1A;--surface-2:#1B2521;--ink:#E2EAE7;--ink-2:#C0CCC7;--muted:#8D9B96;--line:#28342F;
  --accent:#58BD9C;--accent-ink:#0B1914;--accent-soft:#19382E;--work-ink:#A6E0CC;
  --sat:#84A7F1;--sun:#EF867B;--leave:#E4AE4C;--leave-soft:#392C13;--night:#A2ABF1;--night-soft:#24294B;
  --pref:#EC85B4;--danger:#EF867B;--danger-soft:#3C1E1B;--warn:#E4AE4C;--warn-soft:#392C13;--hatch:rgba(226,234,231,.06);
  --cu-blue-bg:#1D2D4A;--cu-blue-fg:#9EBEF2;--cu-violet-bg:#2E2442;--cu-violet-fg:#C9B2EE;--cu-rose-bg:#3E1E28;--cu-rose-fg:#F0A6BC;
  --cu-cyan-bg:#143440;--cu-cyan-fg:#8ED4E4;--cu-lime-bg:#283019;--cu-lime-fg:#C3D387;--cu-slate-bg:#252C31;--cu-slate-fg:#B7C2CB;--dayhead:#3A2B22;--titleband:#4A4517;--titleink:#F4F0C8;--sec-night:#93B4F4;--sec-leave:#E7B355;--sec-etc:#9BD383;color-scheme:dark}
*{box-sizing:border-box}
body{overflow-anchor:none;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.wrap{max-width:1560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-top{display:flex;align-items:center;flex-wrap:wrap;gap:10px 18px;padding-block:12px 8px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.clinic{font-weight:600;font-size:16px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12px;color:var(--muted);line-height:1.2}
.month{display:flex;align-items:center;gap:6px}
.mlabel{font-size:18px;font-weight:600;min-width:128px;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.icon-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:18px;cursor:pointer;display:grid;place-items:center}
.icon-btn:hover{border-color:var(--ink-2)}
.authbox,.savebox{display:flex;align-items:center;gap:8px}
.authbox select{height:34px}
.who{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);font-size:12.5px;font-weight:500;white-space:nowrap}
.savestate{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.warn{background:var(--warn)}.dot.ok{background:var(--accent)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-bottom:-1px}
.tab{appearance:none;border:0;background:none;font:inherit;color:var(--muted);padding:10px 14px 11px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:8px;font-weight:500}
.tab .num{width:20px;height:20px;border-radius:50%;border:1px solid currentColor;display:grid;place-items:center;font-size:11px;font-weight:600}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab[aria-selected="true"] .num{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.teambar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding-block:12px 0}
.teambar .lbl{font-size:12px;color:var(--muted);margin-right:4px}
.tchip{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font:inherit;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.tchip small{font-size:11.5px;color:var(--muted);font-weight:400}
.tchip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tchip[aria-pressed="true"] small{color:inherit;opacity:.75}
.mine{font-size:10.5px;padding:1px 7px;border-radius:999px;background:var(--accent-soft);color:var(--work-ink);font-weight:600}
.tab:focus-visible,.btn:focus-visible,.brush:focus-visible,.icon-btn:focus-visible,.day:focus-visible,.calc:focus-visible,.tchip:focus-visible,.seg button:focus-visible,.swatch:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.main{padding-block:16px 56px;display:flex;flex-direction:column;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.panel h2{margin:0 0 4px;font-size:16px;font-weight:600;text-wrap:balance;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.panel h3{margin:0;font-size:15px;font-weight:600}
.panel>p,.lead{margin:0 0 14px;color:var(--muted);max-width:72ch}
.fine{font-size:12.5px;color:var(--muted);margin:12px 0 0;max-width:86ch}
.btn{height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:500;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{background:var(--danger-soft);border-color:transparent;color:var(--danger)}
.btn.small{height:30px;padding:0 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.note{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:12px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.note.info{background:var(--accent-soft);border-color:transparent;color:var(--work-ink)}
.note.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.note.bad{background:var(--danger-soft);border-color:transparent;color:var(--danger)}
.note .grow{flex:1 1 280px;min-width:0}
.toolbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.brushes{display:flex;flex-wrap:wrap;gap:6px}
.brush{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 12px 0 6px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:500;cursor:pointer}
.brush[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.sw{min-width:24px;height:24px;padding:0 3px;border-radius:6px;display:inline-grid;place-items:center;font-size:11px;font-weight:600;position:relative;line-height:1}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.hint{font-size:13px;color:var(--muted);margin:0;max-width:120ch}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.stat{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:12.5px;font-weight:500;background:var(--surface-2);color:var(--ink-2)}
.stat::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.8}
.stat.good{background:var(--accent-soft);color:var(--work-ink)}
.stat.bad{background:var(--danger-soft);color:var(--danger)}
.stat.warn{background:var(--warn-soft);color:var(--warn)}
.c-work{background:var(--accent-soft);color:var(--work-ink)}
.c-night{background:var(--night-soft);color:var(--night)}
.c-leave{background:var(--leave-soft);color:var(--leave)}
.c-halfam{background:linear-gradient(90deg,var(--leave-soft) 0 50%,var(--accent-soft) 50% 100%);color:var(--leave)}
.c-halfpm{background:linear-gradient(90deg,var(--accent-soft) 0 50%,var(--leave-soft) 50% 100%);color:var(--leave)}
.c-halfnight{background:linear-gradient(90deg,var(--leave-soft) 0 50%,var(--night-soft) 50% 100%);color:var(--night)}
.c-otuse{background:var(--cu-violet-bg);color:var(--cu-violet-fg)}
.c-off{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.c-empty{background:transparent;color:var(--line)}
.c-blue{background:var(--cu-blue-bg);color:var(--cu-blue-fg)}.c-violet{background:var(--cu-violet-bg);color:var(--cu-violet-fg)}
.c-rose{background:var(--cu-rose-bg);color:var(--cu-rose-fg)}.c-cyan{background:var(--cu-cyan-bg);color:var(--cu-cyan-fg)}
.c-lime{background:var(--cu-lime-bg);color:var(--cu-lime-fg)}.c-slate{background:var(--cu-slate-bg);color:var(--cu-slate-fg)}
.c-pref{box-shadow:inset 0 0 0 1px var(--line)}
.c-pref::after,.k.rq::after{content:"";position:absolute;right:3px;top:3px;width:6px;height:6px;border-radius:50%;background:var(--pref)}
.c-auto{box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}
.k.lk::before,.c-lock::before{content:"";position:absolute;left:2px;top:2px;width:0;height:0;border-top:6px solid var(--ink-2);border-right:6px solid transparent;border-top-left-radius:2px}
.grid-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.grid{border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;user-select:none;-webkit-user-select:none}
.grid th,.grid td{padding:0;text-align:center;border-bottom:1px solid var(--line);font-weight:400}
.grid .name{position:sticky;left:0;z-index:2;background:var(--surface);text-align:left;padding:5px 12px;min-width:136px;max-width:176px;border-right:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid .name b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis}
.grid .name small{display:block;font-size:11px;color:var(--muted);line-height:1.3}
.grid thead th{background:var(--surface)}
.corner{vertical-align:bottom;font-size:12px;color:var(--muted)}
.dh{width:38px;min-width:38px;padding:7px 0 0;border-bottom:0!important}
.dn{display:block;font-size:13px;font-weight:600;line-height:1.2}
.dw{display:block;font-size:11px;color:var(--muted);line-height:1.3}
.sat .dn,.sat .dw,th.sat{color:var(--sat)}
.sun .dn,.sun .dw,th.sun{color:var(--sun)}
.dt{font-size:10px;height:20px;color:var(--muted);font-weight:500!important;letter-spacing:.02em}
.dt.hol{color:var(--sun)}.dt.nt{color:var(--night)}.dt.chg{color:var(--accent);font-weight:600!important}
td.c{padding:2px 3px}
.closed{background:repeating-linear-gradient(135deg,var(--hatch) 0 4px,transparent 4px 9px)}
.k{width:32px;height:30px;border:0;border-radius:7px;font:inherit;font-size:12px;font-weight:600;cursor:default;position:relative;display:grid;place-items:center;padding:0;letter-spacing:-.04em}
.k.ed{cursor:pointer;touch-action:pan-y}
.k.sm2{font-size:10.5px}
.k.um{box-shadow:inset 0 0 0 2px var(--pref)}
.k.sel{outline:2px solid var(--ink);outline-offset:-1px;z-index:1}
.k:focus-visible{outline:2px solid var(--accent);outline-offset:1px;z-index:1}
.sm{min-width:54px;padding:0 8px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.sm.first{border-left:1px solid var(--line)}
th.sm{font-size:11.5px;color:var(--muted);vertical-align:bottom;padding-bottom:6px;font-weight:500!important;line-height:1.3}
.sm.bad{color:var(--danger);font-weight:600}
.sm.warn{color:var(--warn);font-weight:600}
.grp th,.grp td{background:var(--surface-2);border-bottom:1px solid var(--line)}
.grp th{font-size:12px;font-weight:600!important;color:var(--ink-2);padding:5px 12px}
.grp th .mine{margin-left:6px}
.grp th span.ld{font-weight:400;color:var(--muted);margin-left:6px}
tfoot .name{font-size:12.5px;color:var(--ink-2)}
tfoot tr.gstart>*{border-top:2px solid var(--line)}
.cnt td{font-size:12px;height:26px;color:var(--ink-2)}
.cnt td.na{color:var(--line)}
.cnt td.short{background:var(--danger-soft);color:var(--danger);font-weight:600}
.cnt .name .ses{color:var(--muted);font-weight:400;margin-left:4px}
.cnt.tot td{font-weight:600;color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:12.5px;color:var(--muted)}
.legend>span{display:inline-flex;align-items:center;gap:6px}
.hatch-sw{width:22px;height:22px;border-radius:6px;border:1px solid var(--line)}
details.how{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
details.how summary{cursor:pointer;font-weight:500}
details.how ol{margin:10px 0 2px;padding-left:20px;color:var(--ink-2);max-width:96ch}
details.how li{margin:3px 0}
.tblwrap{overflow-x:auto;min-width:0}
.tbl{border-collapse:collapse;width:100%}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}
.tbl thead th{font-size:12px;color:var(--muted);font-weight:500}
.tbl tbody th{font-weight:600}
.tbl .num{font-variant-numeric:tabular-nums;color:var(--ink-2)}
.tbl td.desc{white-space:normal;color:var(--muted);font-size:13px;min-width:220px}
input[type=text],input[type=time],input[type=number],input[type=password],select{height:34px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;padding:0 8px;min-width:0}
input[type=number]{width:64px;font-variant-numeric:tabular-nums}
input[type=time]{width:112px;font-variant-numeric:tabular-nums}
input[type=text]{width:140px}
input.short{width:64px}
input.pin{width:130px;letter-spacing:.2em}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
input[disabled],select[disabled]{opacity:.45}
.wide-in{width:min(320px,100%)!important}
.tr{display:inline-flex;align-items:center;gap:6px}
.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer;margin-right:8px}
.chk input{width:16px;height:16px;accent-color:var(--accent)}
.days{display:flex;gap:4px}
.day{width:30px;height:30px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:inherit;font-size:12.5px;cursor:pointer}
.day.on{background:var(--accent-soft);color:var(--work-ink);border-color:transparent;font-weight:600}
.day.sat{color:var(--sat)}.day.sun{color:var(--sun)}
.swatches{display:flex;gap:4px}
.swatch{width:24px;height:24px;border-radius:6px;border:1px solid var(--line);cursor:pointer;padding:0}
.swatch[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:1px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex-wrap:wrap}
.seg button{height:34px;padding:0 14px;border:0;border-right:1px solid var(--line);background:var(--surface);color:var(--ink-2);font:inherit;font-weight:500;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;max-width:860px}
.calh{font-size:12px;color:var(--muted);text-align:center;padding-bottom:2px}
.calh.sun{color:var(--sun)}.calh.sat{color:var(--sat)}
.calc{min-height:70px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);font:inherit;text-align:left;padding:6px 7px;display:flex;flex-direction:column;gap:2px;cursor:pointer;min-width:0}
.calc .d{font-weight:600;font-variant-numeric:tabular-nums}
.calc.sun .d{color:var(--sun)}.calc.sat .d{color:var(--sat)}
.calc .tag{font-size:11px;line-height:1.3;color:var(--muted);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.calc.is-closed{background:repeating-linear-gradient(135deg,var(--hatch) 0 4px,transparent 4px 9px)}
.calc.is-closed .tag{color:var(--sun)}
.calc.is-custom{border-color:var(--accent)}
.calc.is-custom .tag{color:var(--accent);font-weight:500}
.calc.picked{outline:2px solid var(--ink);outline-offset:1px}
.calc.blank{visibility:hidden}
.dated{margin-top:14px;padding:14px;border-radius:10px;background:var(--surface-2);display:flex;flex-direction:column;gap:10px;max-width:860px}
.dated .muted{font-size:13px}
.chg-list{display:flex;flex-direction:column;gap:6px;margin-top:14px;max-width:860px}
.chg-list .row{justify-content:space-between;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.authpanel{max-width:440px;margin:28px auto;display:flex;flex-direction:column;gap:12px}
.authpanel input.pin{width:100%;height:44px;font-size:18px}
.err{color:var(--danger);font-size:13px;margin:0}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:50;font-size:13.5px;max-width:min(560px,calc(100% - 32px));box-shadow:0 6px 24px rgba(0,0,0,.18)}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;line-height:1.65;padding:10px 12px;resize:vertical;display:block}
textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
mark{background:#FFF200;color:#17211E;border-radius:2px;padding:0 1px}
.quick{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px;font-size:13px}
.quick .muted{margin-right:2px}
.qchip{height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font:inherit;font-size:13px;cursor:pointer}
.qchip:hover{border-color:var(--ink-2)}
.qchip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--work-ink)}
.hb-res,.law-list{display:flex;flex-direction:column;gap:14px;min-width:0}
.hb-group,.law-group{display:flex;flex-direction:column;gap:8px}
.grp-h{margin:4px 0 0;font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.hb-card,.qa{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.hb-q{appearance:none;width:100%;display:flex;align-items:center;gap:8px;padding:14px 16px;border:0;background:none;color:var(--ink);font:inherit;font-size:15px;font-weight:600;text-align:left;cursor:pointer;border-radius:12px}
.hb-q:hover{background:var(--surface-2)}
.hb-t{flex:1 1 auto;min-width:0;text-wrap:pretty}
.chev{flex:none;width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translateY(-2px);transition:transform .15s}
.hb-card.open .chev{transform:rotate(-135deg) translateY(-2px)}
.badge{flex:none;font-size:11.5px;font-weight:500;padding:2px 8px;border-radius:999px;white-space:nowrap}
.badge.mgr{background:var(--night-soft);color:var(--night)}
.badge.blank-b{background:var(--warn-soft);color:var(--warn)}
.hb-body{padding:0 16px 14px}
.hb-text{white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;line-height:1.75;color:var(--ink-2);max-width:80ch}
.blank{background:var(--warn-soft);color:var(--warn);border-radius:4px;padding:0 3px;font-weight:500}
.hb-meta{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:12.5px}
.ask-t{color:var(--danger);font-weight:500;align-self:center}
.hb-ed{display:flex;flex-direction:column;gap:12px;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.hb-form{display:flex;flex-wrap:wrap;gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.grow{flex:1 1 260px}
.fld label,.hb-vis legend{font-size:13px;font-weight:500;color:var(--ink-2)}
.fld input[type=text]{width:100%}
.fld .fine{margin-top:2px}
.hb-vis{border:0;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.hb-vis legend{float:left;margin-right:8px;padding:0}
.theirs{background:var(--surface-2);border-radius:8px;padding:8px 12px}
.theirs summary{cursor:pointer;font-weight:500;font-size:13px}
.theirs .hb-text{margin-top:6px;font-size:13px}
.hb-empty p{margin:0 auto 10px;max-width:60ch}
.row.center{justify-content:center}
.linkbtn{appearance:none;border:0;background:none;padding:0;color:var(--accent);font:inherit;font-weight:500;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-align:left}
.qa{padding:14px 16px}
.qa-q{margin:0 0 4px;font-size:15px;font-weight:600;text-wrap:pretty}
.qa-a{margin:0;color:var(--ink-2);line-height:1.7;word-break:keep-all;overflow-wrap:anywhere}
.qa-more{margin-top:8px}
.qa-more ul{margin:0;padding-left:20px;color:var(--ink-2);display:flex;flex-direction:column;gap:4px;line-height:1.65;word-break:keep-all;overflow-wrap:anywhere}
.qa-law{margin:8px 0 0;font-size:12.5px;color:var(--muted)}
.qa-law a{color:var(--accent);text-underline-offset:2px}
.qa-more .linkbtn{margin-top:8px;font-size:13.5px}
.qa-tog{appearance:none;margin-top:8px;height:28px;padding:0 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink-2);font:inherit;font-size:12.5px;cursor:pointer}
.qa-tog:hover{border-color:var(--ink-2)}
.lawgrid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);grid-template-areas:"calc" "list" "help"}
.law-calc{grid-area:calc;min-width:0}.law-list{grid-area:list}.law-help{grid-area:help;min-width:0}

.calc .row{gap:8px}
.calc label{font-weight:500}
.calc-out{margin:12px 0;padding:12px 14px;border-radius:10px;background:var(--accent-soft);color:var(--work-ink)}
.calc-out p{margin:0}
.calc-out .muted{color:var(--work-ink);opacity:.8}
.calc-big{font-size:15px}
.calc-big b{font-size:18px}
.calc-ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:3px;font-size:13.5px;line-height:1.6}
.calc-t{width:100%;border-collapse:collapse;font-size:13px}
.calc-t caption{text-align:left;font-weight:600;font-size:13px;margin-bottom:4px;color:var(--ink-2)}
.calc-t th,.calc-t td{border-top:1px solid var(--line);padding:6px 4px;text-align:left;font-weight:400}
.calc-t th{color:var(--muted);width:42%;white-space:nowrap}
.calc-t td{font-variant-numeric:tabular-nums}
.helplist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.helplist li{display:flex;flex-direction:column;gap:1px}
.helplist a{color:var(--accent);font-weight:500;text-underline-offset:3px}
.helplist .muted{font-size:12.5px}
@media print{.law-calc,.law-help,.quick,.searchbox{display:none}}

function roster(ym,tid,create){var m=S.sched[ym];if(!m){if(!create)return EMPTY_RO;m=S.sched[ym]={}}var r=m[tid];if(!r){if(!create)return EMPTY_RO;r=m[tid]={cells:{},locks:{},reqs:{},adj:{},memo:{},notes:{},place:{},ot:{},gen:false,updatedAt:0}}if(!r.adj)r.adj={};if(!r.memo)r.memo={};if(!r.notes)r.notes={};if(!r.place)r.place={};if(!r.ot)r.ot={};return r}
function gc(r,sid,iso){return (r.cells[sid]&&r.cells[sid][iso])||''}
function isLock(r,sid,iso){return !!(r.locks[sid]&&r.locks[sid][iso])}
function gr(r,sid,iso){return (r.reqs[sid]&&r.reqs[sid][iso])||''}
function setIn(o,sid,iso,v){if(!v){if(o[sid]){delete o[sid][iso];if(!Object.keys(o[sid]).length)delete o[sid]}}else{(o[sid]||(o[sid]={}))[iso]=v}}
function rawCode(r,sid,iso){var v=gc(r,sid,iso);return TY[v]?v:''}
var PX={};
function pOf(sid){if(!(sid in PX)){var L=staffLoc(sid);PX[sid]=L?L.p:null}return PX[sid]}
/* leave of absence (육아휴직 등): no work, no target, not editable */
function absOf(p,iso){var a=p&&p.abs;return !!(a&&a.from&&iso>=a.from&&(!a.to||iso<=a.to))}
function absIn(p,ym){var a=p&&p.abs;if(!a||!a.from)return false;var ds=monthDates(ym);return a.from<=ds[ds.length-1]&&(!a.to||a.to>=ds[0])}
function absText(a){if(!a)return '';var f=parts(a.from),t=a.to?parts(a.to):null;return (a.why||'휴직')+' '+f[0]+'.'+f[1]+'.'+f[2]+'~'+(t?t[0]+'.'+t[1]+'.'+t[2]:'')}
function baseCode(p,iso){var d=di(iso);return (!p||d.type==='closed'||absOf(p,iso)||p.avail.indexOf(d.dow)<0)?'':'W'}
/* what a cell counts as: what was set, otherwise 근무 on a day the person normally works */
function cellCode(r,sid,iso){var p=pOf(sid);if(p&&absOf(p,iso))return '';return rawCode(r,sid,iso)||baseCode(p,iso)}

/* ---------- targets ---------- */
function weeksOf(ym){var ds=monthDates(ym),map={},keys=[];ds.forEach(function(iso){var mk=mondayOf(iso);if(!map[mk]){map[mk]=[];keys.push(mk)}map[mk].push(iso)});
  return keys.map(function(mk){var full=[];for(var i=0;i<7;i++)full.push(addDays(mk,i));return {mk:mk,days:map[mk],full:full}})}
function weekTarget(p,w){var av=p.avail;
  var nf=w.full.filter(function(x){var d=di(x);return d.normal&&av.indexOf(d.dow)>=0}).length;if(!nf)return 0;
  var ni=w.days.filter(function(x){var d=di(x);return d.normal&&av.indexOf(d.dow)>=0&&!absOf(p,x)});
  var credit=S.holidayCredit?ni.filter(function(x){return di(x).type==='closed'}).length:0;
  return Math.max(0,p.weekDays*ni.length/nf-credit)}
function monthTarget(p,ym){return weeksOf(ym).reduce(function(a,w){return a+weekTarget(p,w)},0)}

/* ---------- don't-take-off-together groups ---------- */
function allGroups(){var a=S.groups.slice();S.teams.forEach(function(t){(t.groups||[]).forEach(function(g){a.push(g)})});return a}
/* where a group lives: clinic-wide (admin, 생성 조건) or inside one team (team leader, 팀·직원) */
function grpOwner(id){var g=S.groups.find(function(x){return x.id===id});if(g)return {g:g,team:null,list:S.groups};for(var i=0;i<S.teams.length;i++){var t=S.teams[i],x=(t.groups||[]).find(function(y){return y.id===id});if(x)return {g:x,team:t,list:t.groups}}return null}
function canGrp(o){return !!o&&(o.team?canTeam(o.team.id):isAdmin())}
function grpDirty(o){if(o.team)dTeam(o.team.id);else dConfig()}
/* people in the same group who are already away that day, if putting sid on code would break the group's limit */
function groupBlock(sid,iso,code){var d=di(iso),out=[];if(d.type==='closed')return out;var L=staffLoc(sid);if(!L)return out;var q=pres(code,d,adjOf(roster(ui.ym,L.team.id),L.p,iso,code));if((!d.hasAM||q[0])&&(!d.hasPM||q[1]))return out;
  groupsFor(ui.ym,null).forEach(function(G){if(!G.mem.some(function(m){return m.id===sid}))return;var ab=gAbs(G,iso,sid,null,null);
    if((d.hasAM&&!q[0]&&ab[0]+1>G.max)||(d.hasPM&&!q[1]&&ab[1]+1>G.max))G.mem.forEach(function(m){if(m.id===sid)return;var v=cellCode(m.ro,m.id,iso);if(!v)return;var r=pres(v,d,adjOf(m.ro,m.p,iso,v));if(((d.hasAM&&!r[0])||(d.hasPM&&!r[1]))&&out.indexOf(m.p.name)<0)out.push(m.p.name||'이름 없음')})});
  return out}
/* ask once more before breaking a 함께 쉬지 않기 rule by hand */
function grpGuard(sid,tid,iso,code){var ro=roster(ui.ym,tid);if(cellCode(ro,sid,iso)===code)return true;var who=groupBlock(sid,iso,code);if(!who.length){ui.grpWarn=null;return true}
  var w=ui.grpWarn;if(w&&w.sid===sid&&w.iso===iso&&w.code===code){ui.grpWarn=null;return true}
  ui.grpWarn={sid:sid,iso:iso,code:code};var L=staffLoc(sid);toast((L?L.p.name:'')+' 님은 '+who.join('·')+' 님과 같은 날 함께 쉬면 안 돼요. 그래도 넣으려면 한 번 더 누르세요.');render();return false}
function groupsFor(ym,team){return allGroups().map(function(g){var mem=g.members.map(staffLoc).filter(Boolean);if(mem.length<2||(team&&!mem.some(function(L){return L.team.id===team.id})))return null;
  return {g:g,max:Math.min(g.max,mem.length-1),mem:mem.map(function(L){return {id:L.p.id,p:L.p,team:L.team,inTeam:!!team&&L.team.id===team.id,ro:roster(ym,L.team.id)}})}}).filter(Boolean)}
/* how many members of a group are away from the clinic on a day, per session [am,pm]; empty cells of other teams count as unknown */
function gAbs(G,iso,exceptId,cells,ro){var d=di(iso),a=0,b=0;G.mem.forEach(function(m){if(m.id===exceptId)return;var v=m.inTeam?cells[m.id][iso]:cellCode(m.ro,m.id,iso);if(!v)return;
  var q=pres(v,d,adjOf(m.inTeam?ro:m.ro,m.p,iso,v));if(d.hasAM&&!q[0])a++;if(d.hasPM&&!q[1])b++});return [a,b]}
function groupClashes(ym,teams){var out=[];groupsFor(ym,null).forEach(function(G){if(!G.mem.some(function(m){return teams.indexOf(m.team)>=0}))return;
  monthDates(ym).forEach(function(iso){if(di(iso).type==='closed')return;var ab=gAbs(G,iso,null,null,null);if(ab[0]>G.max||ab[1]>G.max)out.push({iso:iso,G:G})})});return out}
function gNames(G){return G.mem.map(function(m){return m.p.name||'이름 없음'}).join('·')}

/* ---------- generator (one team at a time) ---------- */
function attempt(ctx){
  var team=ctx.team,staff=team.staff,ro=ctx.ro,cells={},cnt={},sat={},nC={};
  ctx.dates.forEach(function(iso){cnt[iso]=[0,0,0]});
  staff.forEach(function(p){cells[p.id]={};sat[p.id]=0;nC[p.id]=0;
    ctx.dates.forEach(function(iso){var d=di(iso),v;
      if(d.type==='closed'||absOf(p,iso))v='';else if(isLock(ro,p.id,iso))v=rawCode(ro,p.id,iso)||'O';else v=p.avail.indexOf(d.dow)>=0?'W':'O';
      cells[p.id][iso]=v;var q=pres(v,d,adjOf(ro,p,iso,v));cnt[iso][0]+=q[0];cnt[iso][1]+=q[1];cnt[iso][2]+=q[2]})});
  var halfElig=staff.filter(function(p){return p.avail.some(function(dw){return S.hours[dw].type==='half'})});
  function nightCap(iso){var c=0;staff.forEach(function(p){var v=cells[p.id][iso];if(p.night&&(v==='W'||isNightCode(v)))c++});return c}
  var R=ctx.R;
  function offScore(p,iso){var d=di(iso),v=Math.random()*4,need=needOf(team,d),q=pres('W',d,adjOf(ro,p,iso,'W')),a=cnt[iso][0]-q[0],b=cnt[iso][1]-q[1],short=0,sur=99;
    if(d.hasAM){short+=Math.max(0,need-a);sur=Math.min(sur,a-need)}
    if(d.hasPM){short+=Math.max(0,need-b);sur=Math.min(sur,b-need)}
    if(short)v-=1000*short;else v+=Math.min(sur,3)*6;
    if(gr(ro,p.id,iso)==='P')v+=400*R.pref;
    if(d.type==='half'&&halfElig.length){var avg=halfElig.reduce(function(s,x){return s+sat[x.id]},0)/halfElig.length;v+=(sat[p.id]-avg)*25*R.sat}
    if(d.night&&p.night&&nightCap(iso)-1<team.need.night)v-=600;
    var pv=cells[p.id][addDays(iso,-1)],nv=cells[p.id][addDays(iso,1)];if(pv==='O'||pv===''||nv==='O'||nv==='')v+=R.offAdj;
    if(R.run>0){var L=0,x=addDays(iso,-1);while(isWork(cells[p.id][x])){L++;x=addDays(x,-1)}var Rr=0;x=addDays(iso,1);while(isWork(cells[p.id][x])){Rr++;x=addDays(x,1)}if(L+1+Rr>S.rules.maxRun)v+=150*R.run}
    var gs=ctx.gOf[p.id];if(gs)gs.forEach(function(G){var ab=gAbs(G,iso,p.id,cells,ro);if((d.hasAM&&ab[0]+1>G.max)||(d.hasPM&&ab[1]+1>G.max))v-=1000});
    return v}
  ctx.weeks.forEach(function(w){var plans=[];
    staff.forEach(function(p){var Tp=weekTarget(p,w),tgt=Math.floor(Tp+1e-9);if(Math.random()<Tp-tgt-1e-9)tgt++;var fixed=0,cand=[];
      w.days.forEach(function(iso){var d=di(iso);if(d.type==='closed'||absOf(p,iso))return;
        if(isLock(ro,p.id,iso)){if(countsTarget(cells[p.id][iso]))fixed++}else if(p.avail.indexOf(d.dow)>=0)cand.push(iso)});
      var offs=Math.max(0,cand.length-Math.max(0,tgt-fixed));if(offs>0)plans.push({p:p,cand:cand,left:offs,r:Math.random()})});
    plans.sort(function(a,b){return (a.cand.length-a.left)-(b.cand.length-b.left)||a.r-b.r});
    var any=true;
    while(any){any=false;plans.forEach(function(pl){if(pl.left<=0)return;any=true;var best=null,bs=-Infinity;
      pl.cand.forEach(function(iso){if(cells[pl.p.id][iso]!=='W')return;var v=offScore(pl.p,iso);if(v>bs){bs=v;best=iso}});
      if(best===null){pl.left=0;return}var q=pres('W',di(best),adjOf(ro,pl.p,best,'W'));cnt[best][0]-=q[0];cnt[best][1]-=q[1];cells[pl.p.id][best]='O';pl.left--})}
    staff.forEach(function(p){w.days.forEach(function(iso){var d=di(iso);if(d.type==='half'&&isWork(cells[p.id][iso]))sat[p.id]++})})});
  ctx.dates.forEach(function(iso){var d=di(iso);if(!d.night||!team.need.night)return;var have=cnt[iso][2];
    var pool=staff.filter(function(p){return p.night&&cells[p.id][iso]==='W'&&!isLock(ro,p.id,iso)&&pres('N',d,adjOf(ro,p,iso,'N'))[2]}).map(function(p){return {p:p,k:nC[p.id]*R.night+Math.random()*0.9}});
    pool.sort(function(a,b){return a.k-b.k});
    for(var i=0;i<pool.length&&have<team.need.night;i++){var pp=pool[i].p,qw=pres('W',d,adjOf(ro,pp,iso,'W')),qn=pres('N',d,adjOf(ro,pp,iso,'N'));cells[pp.id][iso]='N';cnt[iso][0]+=qn[0]-qw[0];cnt[iso][1]+=qn[1]-qw[1];cnt[iso][2]+=qn[2]-qw[2];have=cnt[iso][2]}
    staff.forEach(function(p){if(isNightCode(cells[p.id][iso]))nC[p.id]++})});
  return {cells:cells,cnt:cnt,sat:sat,nC:nC}}
function evaluate(res,ctx){var team=ctx.team,staff=team.staff,ro=ctx.ro,R=ctx.R,short=0,unmet=0,over=0,tdev=0,fair=0,runs=0,lim=S.rules.maxWeekH*60;
  ctx.dates.forEach(function(iso){var d=di(iso);if(d.type==='closed')return;var need=needOf(team,d),c=res.cnt[iso];
    if(d.hasAM)short+=Math.max(0,need-c[0]);if(d.hasPM)short+=Math.max(0,need-c[1]);if(d.night)short+=Math.max(0,team.need.night-c[2])});
  staff.forEach(function(p){var rq=ro.reqs[p.id]||{};Object.keys(rq).forEach(function(iso){if(rq[iso]==='P'&&isWork(res.cells[p.id][iso]))unmet++})});
  function dev(a){if(a.length<2)return 0;var m=a.reduce(function(x,y){return x+y},0)/a.length;return a.reduce(function(x,y){return x+Math.abs(y-m)},0)}
  if(R.sat)fair+=dev(staff.filter(function(p){return p.weekDays>=5&&p.avail.some(function(dw){return S.hours[dw].type==='half'})}).map(function(p){return res.sat[p.id]}))*20*R.sat;
  if(R.night)fair+=dev(staff.filter(function(p){return p.night}).map(function(p){return res.nC[p.id]}))*15*R.night;
  if(R.week)ctx.weeks.forEach(function(w){staff.forEach(function(p){var m=0;w.days.forEach(function(iso){var v=res.cells[p.id][iso];m+=mins(v,di(iso),adjOf(ro,p,iso,v))});if(m>lim)over++})});
  if(R.run)staff.forEach(function(p){var run=0;ctx.dates.forEach(function(iso){if(di(iso).type!=='closed'&&isWork(res.cells[p.id][iso])){run++;if(run>S.rules.maxRun)runs++}else run=0})});
  staff.forEach(function(p){var a=0;ctx.dates.forEach(function(iso){if(countsTarget(res.cells[p.id][iso]))a++});tdev+=Math.abs(a-ctx.tgt[p.id])});
  var gv=0;ctx.groups.forEach(function(G){ctx.dates.forEach(function(iso){if(di(iso).type==='closed')return;var ab=gAbs(G,iso,null,res.cells,ro);gv+=Math.max(0,ab[0]-G.max)+Math.max(0,ab[1]-G.max)})});
  return short*1000+gv*1000+unmet*60*R.pref+fair+over*300*R.week+runs*120*R.run+tdev*8}
function ruleWeights(){var r=S.rules;return {pref:LV[r.pref],sat:LV[r.satFair],night:LV[r.nightFair],week:LV[r.maxWeek],run:LV[r.run],offAdj:r.offStyle==='together'?10:r.offStyle==='spread'?-10:0}}
function genTeam(ym,team){clearDI();var ro=roster(ym,team.id,true),ctx={team:team,ro:ro,dates:monthDates(ym),weeks:weeksOf(ym),tgt:{},R:ruleWeights()};ctx.groups=groupsFor(ym,team);ctx.gOf={};ctx.groups.forEach(function(G){G.mem.forEach(function(m){if(m.inTeam)(ctx.gOf[m.id]||(ctx.gOf[m.id]=[])).push(G)})});
  team.staff.forEach(function(p){ctx.tgt[p.id]=monthTarget(p,ym)});
  var best=null,bv=Infinity,n=EFFORT[S.rules.effort]||220;for(var i=0;i<n;i++){var r=attempt(ctx),v=evaluate(r,ctx);if(v<bv){bv=v;best=r}}
  var ids={};team.staff.forEach(function(p){ids[p.id]=1});Object.keys(ro.cells).forEach(function(k){if(!ids[k])delete ro.cells[k]});
  team.staff.forEach(function(p){var row={};ctx.dates.forEach(function(iso){var v=best.cells[p.id][iso];if(v)row[iso]=v});ro.cells[p.id]=row});
  ro.gen=true}

/* ---------- stats ---------- */
function stats(ym,teams){var dates=monthDates(ym),weeks=weeksOf(ym),per={},days={},T={shortDays:0,shortList:[],req:0,reqMet:0,over:0,wkOver:[],wkUnder:[],lim:(S.rules.maxWeek==='off'?52:S.rules.maxWeekH)*60};
  teams.forEach(function(team){var ro=roster(ym,team.id);
    team.staff.forEach(function(p){var tf=monthTarget(p,ym),o={work:0,half:0,night:0,leave:0,fixed:0,min:0,adj:0,maxW:0,tgt:Math.round(tf),tgtF:tf};
      dates.forEach(function(iso){var d=di(iso),v=cellCode(ro,p.id,iso);if(d.type==='closed'||absOf(p,iso))return;var a=adjOf(ro,p,iso,v),mn=mins(v,d,a);
        if(isWork(v)){o.work++;if(d.type==='half')o.half++}if(isNightCode(v)&&d.night)o.night++;o.leave+=leaveAmt(v);if(countsTarget(v))o.fixed++;
        o.min+=mn;if(a)o.adj+=mins(v,d,null)-mn;
        if(gr(ro,p.id,iso)==='P'){T.req++;if(v&&!isWork(v))T.reqMet++}});
      weeks.forEach(function(w){var m=0,n=0;w.days.forEach(function(iso){var v=cellCode(ro,p.id,iso);m+=mins(v,di(iso),adjOf(ro,p,iso,v));if(di(iso).type!=='closed'&&countsTarget(v))n++});if(m>o.maxW)o.maxW=m;
        if(w.days.length===7){var tg=weekTarget(p,w),it={p:p,mk:w.mk,n:n,t:tg};if(n>Math.ceil(tg-1e-9))T.wkOver.push(it);else if(n<Math.floor(tg+1e-9))T.wkUnder.push(it)}});
      if(o.maxW>T.lim)T.over++;per[p.id]=o})});
  dates.forEach(function(iso){var d=di(iso);if(d.type==='closed')return;var row={teams:{},tot:[0,0,0]},bad=[];
    teams.forEach(function(team){var ro=roster(ym,team.id),c=[0,0,0];team.staff.forEach(function(p){var v=cellCode(ro,p.id,iso),q=pres(v,d,adjOf(ro,p,iso,v));c[0]+=q[0];c[1]+=q[1];c[2]+=q[2]});
      var need=needOf(team,d),nn=d.night?team.need.night:0,x={c:c,need:need,nn:nn,sAM:d.hasAM&&c[0]<need,sPM:d.hasPM&&c[1]<need,sNT:d.night&&c[2]<nn};
      row.teams[team.id]=x;row.tot[0]+=c[0];row.tot[1]+=c[1];row.tot[2]+=c[2];
      if(team.staff.length&&(x.sAM||x.sPM||x.sNT))bad.push(team.name+' '+[x.sAM?'오전':'',x.sPM?'오후':'',x.sNT?'야간':''].filter(Boolean).join('·'))});
    days[iso]=row;if(bad.length){T.shortDays++;T.shortList.push(parts(iso)[1]+'/'+d.day+' '+bad.join(', '))}});
  return {per:per,days:days,T:T}}

/* ---------- render ---------- */
var GRID=null;

  clearDI();rebuildTypes();fixTab();
  var fid=document.activeElement&&document.activeElement.id,body;
  if(ui.view==='loading')body='<section class="panel empty">근무표를 불러오는 중이에요…</section>';
  else if(ui.view==='setup')body=setupView();
  else if(ui.view==='login')body=loginView();
  else if(ui.view==='error')body=errorView();
  else body=banners()+(ui.tab==='hours'?hoursTab():ui.tab==='types'?typesTab():ui.tab==='rules'?rulesTab():ui.tab==='teams'?teamsTab():ui.tab==='place'?placeTab():ui.tab==='rulebook'?rulebookTab():ui.tab==='law'?lawTab():rosterTab());
  var showTeams=ui.view==='app'&&(ui.tab==='roster'||ui.tab==='teams'||ui.tab==='place')&&S.teams.length>0&&!(role()==='leader'&&ui.tab==='teams');
  var de0=document.getElementById('dayed'),dsc=de0?de0.scrollTop:0,dday=ui.shownDay,sy=window.scrollY||0,anc=app.querySelector('.cd-date.sel'),aiso=anc&&anc.dataset.day,at=anc?anc.getBoundingClientRect().top:0;
  app.innerHTML=header()+'<main class="wrap main">'+(showTeams?teamBar():'')+body+'</main>';
  var de1=document.getElementById('dayed');if(de1&&dsc&&dday===ui.selDay)de1.scrollTop=dsc;ui.shownDay=ui.selDay;
  var bar=app.querySelector('.bar');if(bar)document.documentElement.style.setProperty('--barh',bar.offsetHeight+'px');

  if(fid){var el=document.getElementById(fid);if(el&&el.focus)try{el.focus({preventScroll:true})}catch(e){el.focus()}}
  if(ui.view==='app'&&ui.tab==='roster'){indexGrid();refreshStats()}
  /* keep the calendar still while editing: the picked date stays where it was on screen */
  var an2=aiso&&app.querySelector('.cd-date[data-day="'+aiso+'"]');
  try{if(an2){var dy=an2.getBoundingClientRect().top-at;if(Math.abs(dy)>1)window.scrollBy(0,dy)}else if(sy&&Math.abs((window.scrollY||0)-sy)>1)window.scrollTo(0,sy)}catch(e){}
}
function header(){
  var tabs=ui.view==='app'?tabsFor():[];
  var auth='';
  if(MODE==='server'){
    if(ui.view==='app'){auth=ui.auth?'<span class="who">'+esc(authLabel())+'</span><button class="btn small" data-act="logout">로그아웃</button>':'<span class="who">보기 전용</span><button class="btn small" data-act="toLogin">로그인</button>';
      auth+='<button class="icon-btn" data-act="reload" aria-label="최신 내용 다시 불러오기" title="최신 내용 다시 불러오기">↻</button>'}
  }else if(!ui.ro){
    auth='<label class="vh" for="preview">미리보기 권한</label><select id="preview" data-f="preview" title="팀장·직원 화면을 미리 볼 수 있어요"><option value="admin"'+(ui.preview==='admin'?' selected':'')+'>관리자 화면</option>'+
      S.teams.map(function(t){return '<option value="'+t.id+'"'+(ui.preview===t.id?' selected':'')+'>'+esc(t.name)+' 팀장 화면</option>'}).join('')+'<option value="viewer"'+(ui.preview==='viewer'?' selected':'')+'>직원(보기) 화면</option></select>';
  }
  var save='';

function fmtMin(m){if(!m)return '0';return (m<0?'−':'')+hLong(Math.abs(m))}

function otUse(ro,p,iso){var d=di(iso);if(d.type==='closed'||absOf(p,iso))return 0;var v=cellCode(ro,p.id,iso);if(v==='OT')return mins('W',d,adjOf(ro,p,iso,'W'));var c=isWork(v)&&ro.adj&&ro.adj[p.id]&&ro.adj[p.id][iso];return c&&c.ot?(c.e||0)+(c.l||0):0}
function otMonth(p,ym){var m=S.sched[ym]||{},earn=0,use=0;Object.keys(m).forEach(function(tid){var ro=m[tid],e=ro.ot&&ro.ot[p.id];if(e)Object.keys(e).forEach(function(iso){earn+=e[iso]});
  if((ro.cells&&ro.cells[p.id])||(ro.adj&&ro.adj[p.id]))monthDates(ym).forEach(function(iso){if(rawCode(ro,p.id,iso)||(ro.adj[p.id]&&ro.adj[p.id][iso]))use+=otUse(ro,p,iso)})});return {earn:earn,use:use}}
/* OT left at the end of a month: carried-in + everything earned − everything used up to then */
function otBalance(p,ym){var b=p.ot0||0;Object.keys(S.sched).forEach(function(k){if(k<=ym){var x=otMonth(p,k);b+=x.earn-x.use}});return b}

function balancePanel(ym,teams){var eds=teams.filter(function(t){return canTeam(t.id)});if(!eds.length)return '';var y=ym.slice(0,4),mo=+ym.slice(5),used=leaveUsedMap(y);

function mark(s,ts){s=String(s==null?'':s);if(!ts||!ts.length)return esc(s);var low=s.toLowerCase(),out='',i=0;

  return out}

function hbSave(){var e=ui.hbEdit;if(!e||ui.hbSaving||!hbCanWrite())return;

  p:['병원마다 연차와 따로 주기도 하고, 연차에서 빼기도 해요.'],ref:'법에 정한 휴가가 아니라 취업규칙·근로계약으로 정해요.',t:'경조사 결혼 장례 사망 상 여름휴가 하계휴가 휴가',hb:'경조사'},
 {id:'r5',c:'rest',q:'가족을 돌봐야 할 때 쉴 수 있나요?',a:'가족이 아프거나 다쳤을 때, 또는 자녀를 돌봐야 할 때 가족돌봄휴가(1년에 10일, 하루 단위)를 쓸 수 있어요. 오래 돌봐야 하면 가족돌봄휴직(1년에 최대 90일)도 있어요.',
  p:['가족: 부모, 배우자, 자녀, 배우자의 부모, 조부모, 손자녀.','가족돌봄휴가 10일은 가족돌봄휴직 90일 안에 들어가요.','휴직은 한 번에 30일 이상 써야 해요.','법으로는 무급이에요. 병원이 따로 정했다면 취업규칙을 따라요.'],
  law:[['남녀고용평등법','제22조의2']],t:'가족돌봄 가족 간병 병간호 부모님 자녀 아이 아플 때 휴직'},
 {id:'b1',c:'birth',q:'출산휴가는 얼마나 쓸 수 있나요?',a:'출산 전후로 90일(쌍둥이 이상 120일, 미숙아를 낳으면 100일)을 쓸 수 있어요. 출산 뒤에 45일(쌍둥이 이상 60일) 이상이 남도록 나눠야 해요.',
  p:['처음 60일(쌍둥이 이상 75일)은 병원이 유급으로 줘야 해요. 고용보험에서도 출산전후휴가 급여를 지원해요(상한 있음, 고용24에서 신청).','유산·사산 경험이 있거나 만 40세 이상이거나 의사 진단이 있으면 출산 전에도 나눠 쓸 수 있어요.','출산휴가 기간과 그 뒤 30일 동안은 해고할 수 없어요.'],
  law:[['근로기준법','제74조'],['근로기준법','제23조']],t:'출산휴가 출산전후휴가 산휴 산전후 출산 쌍둥이 미숙아 임신'},
 {id:'b2',c:'birth',q:'임신 중에 일하는 시간을 줄일 수 있나요?',a:'임신 12주 이내이거나 32주 이후라면 하루 2시간 줄여 일할 수 있어요. 월급은 깎이지 않아요.',
  p:['의사가 고위험 임신이라고 진단하면 임신 기간 내내 줄일 수 있어요.','임신 중에는 연장근로(시간 외 근무)를 할 수 없어요.','하루 근무시간은 그대로 두고 출근·퇴근 시간을 바꿔 달라고 할 수 있어요.','정기 검진(태아 검진)에 필요한 시간을 받을 수 있고, 그 시간도 월급에서 빼지 않아요.'],
  law:[['근로기준법','제74조'],['근로기준법','제74조의2']],t:'임신 근로시간 단축 임산부 검진 태아검진 출퇴근 시간 변경 연장근로 금지'},
 {id:'b3',c:'birth',q:'배우자가 출산하면 휴가가 있나요?',a:'배우자 출산휴가 20일(유급)을 쓸 수 있어요. 출산한 날부터 120일 안에, 4번까지 나눠 쓸 수 있어요.',
  p:['고용보험에서 배우자 출산휴가 급여를 지원해요(고용24에서 신청).','휴가를 썼다고 불이익을 주면 안 돼요.'],law:[['남녀고용평등법','제18조의2']],t:'배우자 출산휴가 아빠 남편 출산'},
 {id:'b4',c:'birth',q:'난임 치료를 받을 때 쉴 수 있나요?',a:'난임치료휴가를 1년에 6일 쓸 수 있어요. 처음 2일은 유급이에요.',p:['시술 같은 치료를 받으려고 쓰는 휴가예요. 업무 사정이 있으면 병원이 날짜를 바꿔 달라고 할 수 있어요.'],law:[['남녀고용평등법','제18조의3']],t:'난임 시술 치료 휴가 임신 준비'},
 {id:'b5',c:'birth',q:'유산·사산했을 때 휴가가 있나요?',a:'임신 기간에 따라 유산·사산휴가를 받을 수 있어요. 15주 이내 10일, 16~21주 30일, 22~27주 60일, 28주 이상 90일이에요.',
  p:['직원이 청구하면 병원은 꼭 줘야 해요.','출산휴가처럼 처음 60일까지는 유급이고, 고용보험 급여도 지원돼요.'],law:[['근로기준법','제74조']],t:'유산 사산 휴가 임신'},
 {id:'c1',c:'child',q:'육아휴직은 누가, 얼마나 쓸 수 있나요?',a:'만 8세 이하(또는 초등학교 2학년 이하) 자녀가 있으면 엄마·아빠가 각각 1년씩 쓸 수 있어요. 부모가 각각 3개월 이상 쓰면 1년 6개월까지 늘어나요.',
  p:['한부모, 중증 장애아동의 부모도 1년 6개월까지 쓸 수 있어요.','4번까지 나눠 쓸 수 있어요.','시작하려는 날 30일 전까지 병원에 신청해요.','입사한 지 6개월이 안 됐으면 병원이 거절할 수 있어요.','휴직 기간도 근속기간에 들어가고, 연차를 계산할 때 출근한 것으로 쳐요.','끝나면 전과 같은 일이나 같은 수준의 임금을 받는 자리로 돌아와요. 육아휴직을 이유로 해고하거나 불이익을 주면 안 돼요.'],
  law:[['남녀고용평등법','제19조']],t:'육아휴직 육휴 휴직 아이 자녀 1년6개월 분할 복직'},
 {id:'c2',c:'child',q:'육아휴직 중에 돈은 얼마나 받나요?',a:'고용보험에서 육아휴직 급여를 받아요. 1~3개월은 통상임금의 100%(월 최대 250만 원), 4~6개월은 100%(월 최대 200만 원), 7개월부터는 80%(월 최대 160만 원)예요.',
  p:['최소 금액은 월 70만 원이에요.','휴직을 시작하고 1개월이 지난 뒤부터, 끝난 뒤 12개월 안에 고용24에서 신청해요.','예전처럼 일부를 복직한 뒤에 나눠 주지 않고, 휴직하는 동안 다 받아요.','생후 18개월 안의 자녀를 두고 부모가 모두 육아휴직을 쓰면(6+6 부모육아휴직제) 첫 6개월은 상한이 더 높아요(최대 월 450만 원).','고용보험에 180일 이상 가입돼 있어야 받을 수 있어요.'],
  law:[['고용보험법','제70조']],t:'육아휴직 급여 돈 수당 고용24 6+6 상한 통상임금 얼마'},
 {id:'c3',c:'child',q:'아이를 키우면서 일하는 시간을 줄일 수 있나요?',a:'만 12세 이하(또는 초등학교 6학년 이하) 자녀가 있으면 육아기 근로시간 단축을 쓸 수 있어요. 주 15~35시간으로 줄여 일해요.',
  p:['기간은 1년이고, 육아휴직을 다 쓰지 않았다면 남은 기간의 2배만큼 더 쓸 수 있어요(최대 3년).','1개월 단위로 나눠 쓸 수 있어요.','줄어든 시간만큼 고용보험에서 급여를 받아요(고용24에서 신청).','단축을 이유로 불이익을 주면 안 되고, 끝나면 원래 근무로 돌아와요.'],
  law:[['남녀고용평등법','제19조의2']],t:'육아기 근로시간 단축 단축근무 아이 자녀 초등학생'},
 {id:'h1',c:'hours',q:'하루·일주일에 몇 시간까지 일할 수 있나요?',a:'기본은 하루 8시간, 일주일 40시간이에요. 직원이 동의하면 일주일에 12시간까지 더 일할 수 있어서, 최대 주 52시간이에요.',
  p:['휴게시간(점심시간 등)은 근무시간에 들어가지 않아요.'],law:[['근로기준법','제50조'],['근로기준법','제53조']],t:'근로시간 52시간 40시간 8시간 연장근로 한도'},
 {id:'h2',c:'hours',q:'휴게시간은 얼마나 있어야 하나요?',a:'4시간 일하면 30분 이상, 8시간 일하면 1시간 이상 쉬어야 해요. 일하는 중간에 주고, 자유롭게 쓸 수 있어야 해요.',p:['보통 점심시간이 이 휴게시간이에요.'],law:[['근로기준법','제54조']],t:'휴게 점심 쉬는시간 휴식'},
 {id:'h3',c:'hours',q:'연장·야간·휴일에 일하면 수당이 더 붙나요?',a:'네. 하루 8시간·주 40시간을 넘긴 시간(연장), 밤 10시~아침 6시(야간), 휴일에 일한 시간은 통상임금의 50%를 더 받아요. 휴일에 8시간을 넘긴 시간은 100%를 더 받아요.',
  p:['병원의 ‘야간 진료’(예: 저녁 8시까지)는 법에서 말하는 야간근로(밤 10시 이후)가 아니에요. 대신 하루 8시간이나 주 40시간을 넘기면 연장근로예요.','하루 8시간·주 40시간을 넘지 않는 추가 근무는 50%가 붙지 않고 일한 시간만큼 받아요.','연장과 야간이 겹치면 각각 더해요.'],
  law:[['근로기준법','제56조']],t:'연장근로 야간 휴일 수당 가산 1.5배 OT 오버타임 초과근무 야근 야간진료'},
 {id:'h4',c:'hours',q:'OT(초과근무) 대신 쉬는 시간으로 받을 수 있나요?',a:'네. 근로자대표와 서면으로 합의하면 연장·야간·휴일근로 수당 대신 휴가로 줄 수 있어요(보상휴가제). 이때 휴가는 수당만큼이어야 해서, 연장 1시간이면 보통 1시간 30분이에요.',
  p:['쓰지 못한 보상휴가는 수당으로 받아야 해요.','하루 8시간·주 40시간 안의 추가 근무는 50%가 붙지 않아서 일한 만큼(1:1) 쉬어도 돼요.','우리 병원의 OT 사용 방법은 취업규칙 탭에서 확인하세요. 남은 OT는 팀장이 근무표에서 관리해요.'],
  law:[['근로기준법','제57조']],t:'OT 오버타임 보상휴가 대체휴가 초과근무 조기퇴근 일찍 퇴근 늦게 출근 30분',hb:'OT'},
 {id:'p1',c:'pay',q:'최저임금은 얼마인가요?',a:'2026년은 시간당 10,320원(주 40시간이면 월 2,156,880원)이에요. 2027년 1월 1일부터는 시간당 10,700원(월 2,236,300원)이에요.',
  p:['월 환산액은 주휴시간을 넣은 월 209시간 기준이에요.'],law:[['최저임금법','제6조']],t:'최저임금 최저시급 시급 월급 2026 2027 10320 10700'},
 {id:'p2',c:'pay',q:'월급은 어떻게 받아야 하나요?',a:'매달 1번 이상 정해진 날에, 돈으로, 직접, 전액을 받아야 해요. 임금명세서도 받아야 해요.',
  p:['임금명세서에는 기본급·수당·공제 내역과 계산 방법이 들어가요.','우리 병원 급여일은 취업규칙 탭에서 확인하세요.'],law:[['근로기준법','제43조'],['근로기준법','제48조']],t:'월급 급여일 월급날 임금 명세서 지급',hb:'급여'},
 {id:'p3',c:'pay',q:'퇴직금은 언제, 얼마나 받나요?',a:'1년 이상 일하고 일주일에 15시간 이상 일했다면 퇴직금을 받아요. 일한 1년마다 30일분의 평균임금이에요.',
  p:['퇴사하고 14일 안에 받아야 해요(서로 합의하면 늦출 수 있어요).','퇴직연금에 가입돼 있으면 연금 계좌로 받아요.','평균임금은 퇴사 전 3개월 동안 받은 임금을 그 기간의 날수로 나눈 금액이에요.'],
  law:[['근로자퇴직급여보장법','제8조'],['근로기준법','제36조']],t:'퇴직금 퇴사 퇴직연금 평균임금 그만둘 때'},
 {id:'p4',c:'pay',q:'해고되거나 그만둘 때 알아둘 것은?',a:'병원이 해고하려면 정당한 이유가 있어야 하고, 이유와 날짜를 서면으로 알려야 해요. 30일 전에 미리 알리지 않았다면 30일분 통상임금을 줘야 해요.',
  p:['직원이 그만둘 때는 근무표를 다시 짜야 하니, 취업규칙·근로계약서에서 정한 기간 전에 미리 알려 주세요.','부당하게 해고됐다고 생각하면 3개월 안에 노동위원회에 구제 신청을 할 수 있어요.'],
  law:[['근로기준법','제23조'],['근로기준법','제26조'],['근로기준법','제27조'],['근로기준법','제28조']],t:'해고 퇴사 사직 그만둘 때 해고예고 부당해고',hb:'그만둘'},
 {id:'w1',c:'work',q:'근로계약서는 꼭 받아야 하나요?',a:'네. 일을 시작할 때 임금, 근로시간, 휴일, 연차 같은 내용이 적힌 근로계약서를 서면으로 받아야 해요.',p:['임금 같은 중요한 내용이 바뀌면 바뀐 내용도 서면으로 받아요.'],law:[['근로기준법','제17조']],t:'근로계약서 계약서 서면 입사'},
 {id:'w2',c:'work',q:'직장 내 괴롭힘을 당하면 어떻게 하나요?',a:'직장에서 지위나 관계를 이용해 업무 범위를 넘어 괴롭히는 것은 법으로 금지돼 있어요. 병원(원장님)에 알리면 병원은 바로 조사하고 보호해야 해요.',
  p:['신고했다는 이유로 불이익을 주면 안 돼요.','병원 안에서 해결하기 어려우면 고용노동부(☎ 1350)에 신고할 수 있어요.'],law:[['근로기준법','제76조의2'],['근로기준법','제76조의3']],t:'괴롭힘 갑질 폭언 신고 따돌림'},
 {id:'w3',c:'work',q:'직장 내 성희롱은 어떻게 예방하고 신고하나요?',a:'병원은 1년에 1번 이상 성희롱 예방교육을 해야 하고, 신고가 들어오면 조사하고 피해자를 보호해야 해요.',
  p:['신고했다는 이유로 불이익을 주면 안 돼요.','고용노동부(☎ 1350)에도 신고할 수 있어요.'],law:[['남녀고용평등법','제13조'],['남녀고용평등법','제14조']],t:'성희롱 예방교육 신고'},
 {id:'w4',c:'work',q:'일하다 다치거나 병이 나면요?',a:'일 때문에 다치거나 병이 나면 산재보험으로 치료비와, 쉬는 동안 휴업급여(평균임금의 70%)를 받을 수 있어요.',
  p:['근로복지공단(☎ 1588-0075)에 신청해요. 병원이 산재 신청을 막으면 안 돼요.','출퇴근길 사고도 산재가 될 수 있어요.'],law:[['산업재해보상보험법','제37조']],t:'산재 다침 부상 사고 치료 출퇴근 근로복지공단'}
];

function moveStaff(L,tid){var to=teamById(tid);if(!to||to.id===L.team.id||!isAdmin())return;var from=L.team;
  from.staff=from.staff.filter(function(p){return p.id!==L.p.id});to.staff.push(L.p);(from.groups||[]).forEach(function(g){var i=g.members.indexOf(L.p.id);if(i>=0)g.members.splice(i,1)});
  Object.keys(S.sched).forEach(function(ym){var a=S.sched[ym][from.id];if(!a)return;var moved=false;['cells','locks','reqs','adj','notes','place','ot'].forEach(function(k){if(a[k]&&a[k][L.p.id]){var b=roster(ym,to.id,true);b[k][L.p.id]=a[k][L.p.id];delete a[k][L.p.id];moved=true}});if(moved){dRoster(ym,from.id);dRoster(ym,to.id)}});
  dTeam(from.id);dTeam(to.id);toast(L.p.name+' 님을 '+to.name+'(으)로 옮겼어요.')}

/* ---------- server (Google Apps Script) ---------- */
function api(action,payload,again){var body=JSON.stringify(Object.assign({action:action},payload||{}));
  /* reading calls try once more: right after a server update Google can answer with a page instead of data for a few seconds */
  return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:body,redirect:'follow'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).catch(function(e){
    if(!again&&(action==='status'||action==='load'||action==='login'))return new Promise(function(res){setTimeout(res,1500)}).then(function(){return api(action,payload,true)});throw e})}
function pinArg(){return ui.auth?ui.auth.pin:''}
function readAuth(){var raw=ssGet(KEYS.auth)||lsGet(KEYS.auth);try{return raw?JSON.parse(raw):null}catch(e){return null}}
function writeAuth(rem){var v=JSON.stringify({pin:ui.auth.pin,remember:!!rem});ssSet(KEYS.auth,v);if(rem)lsSet(KEYS.auth,v);else lsDel(KEYS.auth)}
function clearAuth(){ssDel(KEYS.auth);lsDel(KEYS.auth)}
function errMsg(r){var e=r&&r.error;return e==='pin'?'PIN이 맞지 않아요.':e==='locked'?'PIN을 여러 번 틀려서 10분 동안 잠겼어요. 잠시 뒤 다시 시도하세요.':e==='forbidden'?'이 작업을 할 권한이 없어요.':e==='duplicate'?'다른 사람이 쓰는 PIN과 같아요. 다른 PIN을 정하세요.':e==='weak'?'PIN은 4~12자로 정하세요.':e==='name'?'이름을 입력하세요.':e==='exists'?'관리자 PIN이 이미 있어요. 로그인하세요.':e==='title'?'제목을 적어 주세요.':e==='full'?'항목은 200개까지 쓸 수 있어요.':(r&&r.message)||'처리하지 못했어요.'}
function netFail(err){ui.netErr='서버에 연결하지 못했어요. ('+(err&&err.message?err.message:'네트워크 오류')+')';if(ui.view!=='app')ui.view='error';render()}
function boot(){
  if(MODE!=='server'){exampleFill();render();return}
  ui.view='loading';render();
  api('status').then(function(st){if(!st||!st.ok)throw new Error(errMsg(st));ui.status=st;if(st.clinic)S.clinic=st.clinic;
    if(!st.hasAdmin){ui.view='setup';render();return}
    var saved=readAuth();if(saved&&saved.pin)return doLogin(saved.pin,saved.remember,true);
    if(st.viewPin){ui.view='login';render();return}
    return loadData()}).catch(netFail)}
function claim(){var a=(document.getElementById('setPin1')||{}).value||'',b=(document.getElementById('setPin2')||{}).value||'';
  if(a.length<4||a.length>12){ui.loginErr='PIN은 4~12자로 정하세요.';render();return}if(a!==b){ui.loginErr='두 번 입력한 PIN이 달라요.';render();return}
  api('claimAdmin',{pin:a}).then(function(r){if(!r.ok){ui.loginErr=errMsg(r);render();return}ui.status.hasAdmin=true;doLogin(a,false,false)}).catch(netFail)}
function doLogin(pin,rem,silent){return api('login',{pin:pin}).then(function(r){
  if(!r.ok){if(silent&&r.error!=='pin')throw new Error('로그인을 확인하는 중에 서버가 잠시 응답하지 않았어요');if(silent){clearAuth();if(ui.status&&ui.status.viewPin){ui.view='login';ui.loginErr='다시 로그인해 주세요.';render();return}return loadData()}ui.loginErr=errMsg(r);render();return}
  ui.auth={role:r.role,teamId:r.teamId||null,leaderId:r.leaderId||null,name:r.name||'',pin:pin};writeAuth(rem);ui.loginErr='';ui.team=r.role==='leader'?r.teamId:'all';ui.tab='roster';return loadData()}).catch(netFail)}
function loadData(){ui.view=ui.view==='app'?'app':'loading';if(ui.view==='loading')render();
  return api('load',{pin:pinArg()}).then(function(r){
    if(!r.ok){if(r.error==='pin'||r.error==='auth'){clearAuth();ui.auth=null;ui.view='login';ui.loginErr=r.error==='auth'?'열람 PIN이 필요해요.':'다시 로그인해 주세요.';render();return}throw new Error(errMsg(r))}
    applyServer(r);ui.dirty=freshDirty();ui.conflict=null;ui.lastSync=Date.now();ui.view='app';render()}).catch(netFail)}
function applyServer(r){var d=r.data||{},c=d.config||{};var n=blankState();n.clinic=c.clinic||'';n.holidayCredit=c.holidayCredit!==false;n.rules=c.rules||{};n.groups=c.groups||[];n.labels=c.labels||{};n.hours=c.hours||n.hours;n.dateHours=c.dateHours||{};n.types=c.types||[];
  n.teams=(c.teamOrder||[]).map(function(id){return (d.teams||{})[id]}).filter(Boolean);n.sched=d.sched||{};n.handbook=d.handbook||{items:[]};n.meta={configAt:c.updatedAt||0};S=normalize(n);ui.pins=r.pins||null;
  if(ui.auth&&ui.auth.role==='leader'&&!teamById(ui.auth.teamId)){ui.auth=null;clearAuth()}rebuildTypes()}
function saveServer(){var pin=pinArg(),steps=[];
  if(ui.dirty.config&&isAdmin())steps.push(function(){return api('saveConfig',{pin:pin,base:S.meta.configAt||0,config:{clinic:S.clinic,holidayCredit:S.holidayCredit,labels:S.labels,rules:S.rules,groups:S.groups,hours:S.hours,dateHours:S.dateHours,types:S.types,teams:S.teams.map(function(t){return {id:t.id,name:t.name,leader:t.leader}})}}).then(function(r){
    if(!r.ok)throw r;S.meta.configAt=r.updatedAt;Object.keys(r.teams||{}).forEach(function(id){var tm=teamById(id);if(tm&&!ui.dirty.teams[id])tm.updatedAt=r.teams[id];else if(tm&&!tm.updatedAt)tm.updatedAt=r.teams[id]});ui.dirty.config=false})});
  Object.keys(ui.dirty.teams).forEach(function(tid){steps.push(function(){var tm=teamById(tid);if(!tm||!canTeam(tid)){delete ui.dirty.teams[tid];return Promise.resolve()}
    return api('saveTeam',{pin:pin,base:tm.updatedAt||0,team:{id:tm.id,need:tm.need,staff:tm.staff,groups:tm.groups||[],posts:tm.posts||[]}}).then(function(r){if(!r.ok){r.what=tm.name+' 직원 명단';throw r}tm.updatedAt=r.updatedAt;tm.updatedBy=r.updatedBy||'';delete ui.dirty.teams[tid]})})});
  Object.keys(ui.dirty.rosters).forEach(function(key){steps.push(function(){var p=key.split('|'),ym=p[0],tid=p[1],tm=teamById(tid);if(!tm||!canTeam(tid)){delete ui.dirty.rosters[key];return Promise.resolve()}
    var ro=roster(ym,tid,true);return api('saveRoster',{pin:pin,ym:ym,teamId:tid,base:ro.updatedAt||0,roster:{cells:ro.cells,locks:ro.locks,reqs:ro.reqs,adj:ro.adj,memo:ro.memo,notes:ro.notes,place:ro.place||{},ot:ro.ot||{},gen:ro.gen}}).then(function(r){if(!r.ok){r.what=tm.name+' '+ymLabel(ym)+' 근무표';throw r}ro.updatedAt=r.updatedAt;ro.updatedBy=r.updatedBy||'';delete ui.dirty.rosters[key]})})});
  return steps.reduce(function(p,f){return p.then(f)},Promise.resolve())}
function setPin(target,clear){var inp=document.getElementById('pin-'+target.replace(':','-')),v=clear?'':((inp&&inp.value)||'');
