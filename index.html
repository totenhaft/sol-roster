<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>솔안과 근무표</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style id="app-style">/* layout: app bar (clinic, month, login, save) + team bar under the clinic name; numbered tabs by role; the roster grid is the working surface and scrolls sideways inside its own frame */
:root{
  --bg:#F2F5F3;--surface:#FFFFFF;--surface-2:#EAF0ED;--ink:#17211E;--ink-2:#3A4642;--muted:#64716C;--line:#D8E0DC;
  --accent:#1C6A56;--accent-ink:#FFFFFF;--accent-soft:#DCEEE7;--work-ink:#155240;
  --sat:#2352B0;--sun:#C2392D;--leave:#94600A;--leave-soft:#FAEDD2;--night:#3B468E;--night-soft:#E3E5F6;
  --pref:#B1356D;--danger:#C2392D;--danger-soft:#FBE2DE;--warn:#94600A;--warn-soft:#FAEDD2;--hatch:rgba(23,33,30,.07);
  --cu-blue-bg:#DDE8FA;--cu-blue-fg:#1F4E9C;--cu-violet-bg:#ECE2F7;--cu-violet-fg:#5A3590;--cu-rose-bg:#F8DFE6;--cu-rose-fg:#982B4A;
  --cu-cyan-bg:#D6EEF4;--cu-cyan-fg:#105D70;--cu-lime-bg:#E7EFD0;--cu-lime-fg:#4C5E12;--cu-slate-bg:#E3E7EA;--cu-slate-fg:#3D4A55;
  --dayhead:#FCE7DA;--titleband:#FFF200;--titleink:#17211E;--sec-night:#2352B0;--sec-leave:#A86A00;--sec-etc:#3B7A2A;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412;--surface:#151D1A;--surface-2:#1B2521;--ink:#E2EAE7;--ink-2:#C0CCC7;--muted:#8D9B96;--line:#28342F;
  --accent:#58BD9C;--accent-ink:#0B1914;--accent-soft:#19382E;--work-ink:#A6E0CC;
  --sat:#84A7F1;--sun:#EF867B;--leave:#E4AE4C;--leave-soft:#392C13;--night:#A2ABF1;--night-soft:#24294B;
  --pref:#EC85B4;--danger:#EF867B;--danger-soft:#3C1E1B;--warn:#E4AE4C;--warn-soft:#392C13;--hatch:rgba(226,234,231,.06);
  --cu-blue-bg:#1D2D4A;--cu-blue-fg:#9EBEF2;--cu-violet-bg:#2E2442;--cu-violet-fg:#C9B2EE;--cu-rose-bg:#3E1E28;--cu-rose-fg:#F0A6BC;
  --cu-cyan-bg:#143440;--cu-cyan-fg:#8ED4E4;--cu-lime-bg:#283019;--cu-lime-fg:#C3D387;--cu-slate-bg:#252C31;--cu-slate-fg:#B7C2CB;--dayhead:#3A2B22;--titleband:#4A4517;--titleink:#F4F0C8;--sec-night:#93B4F4;--sec-leave:#E7B355;--sec-etc:#9BD383;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412;--surface:#151D1A;--surface-2:#1B2521;--ink:#E2EAE7;--ink-2:#C0CCC7;--muted:#8D9B96;--line:#28342F;
  --accent:#58BD9C;--accent-ink:#0B1914;--accent-soft:#19382E;--work-ink:#A6E0CC;
  --sat:#84A7F1;--sun:#EF867B;--leave:#E4AE4C;--leave-soft:#392C13;--night:#A2ABF1;--night-soft:#24294B;
  --pref:#EC85B4;--danger:#EF867B;--danger-soft:#3C1E1B;--warn:#E4AE4C;--warn-soft:#392C13;--hatch:rgba(226,234,231,.06);
  --cu-blue-bg:#1D2D4A;--cu-blue-fg:#9EBEF2;--cu-violet-bg:#2E2442;--cu-violet-fg:#C9B2EE;--cu-rose-bg:#3E1E28;--cu-rose-fg:#F0A6BC;
  --cu-cyan-bg:#143440;--cu-cyan-fg:#8ED4E4;--cu-lime-bg:#283019;--cu-lime-fg:#C3D387;--cu-slate-bg:#252C31;--cu-slate-fg:#B7C2CB;--dayhead:#3A2B22;--titleband:#4A4517;--titleink:#F4F0C8;--sec-night:#93B4F4;--sec-leave:#E7B355;--sec-etc:#9BD383;color-scheme:dark}
*{box-sizing:border-box}
body{overflow-anchor:none;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.wrap{max-width:1560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-top{display:flex;align-items:center;flex-wrap:wrap;gap:10px 18px;padding-block:12px 8px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.clinic{font-weight:600;font-size:16px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12px;color:var(--muted);line-height:1.2}
.month{display:flex;align-items:center;gap:6px}
.mlabel{font-size:18px;font-weight:600;min-width:128px;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.icon-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:18px;cursor:pointer;display:grid;place-items:center}
.icon-btn:hover{border-color:var(--ink-2)}
.authbox,.savebox{display:flex;align-items:center;gap:8px}
.authbox select{height:34px}
.who{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);font-size:12.5px;font-weight:500;white-space:nowrap}
.savestate{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.warn{background:var(--warn)}.dot.ok{background:var(--accent)}.dot.bad{background:var(--danger)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-bottom:-1px}
.tab{appearance:none;border:0;background:none;font:inherit;color:var(--muted);padding:10px 14px 11px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:8px;font-weight:500}
.tab .num{width:20px;height:20px;border-radius:50%;border:1px solid currentColor;display:grid;place-items:center;font-size:11px;font-weight:600}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab[aria-selected="true"] .num{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.teambar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding-block:12px 0}
.teambar .lbl{font-size:12px;color:var(--muted);margin-right:4px}
.tchip{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font:inherit;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.tchip small{font-size:11.5px;color:var(--muted);font-weight:400}
.tchip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tchip[aria-pressed="true"] small{color:inherit;opacity:.75}
.mine{font-size:10.5px;padding:1px 7px;border-radius:999px;background:var(--accent-soft);color:var(--work-ink);font-weight:600}
.tab:focus-visible,.btn:focus-visible,.brush:focus-visible,.icon-btn:focus-visible,.day:focus-visible,.calc:focus-visible,.tchip:focus-visible,.seg button:focus-visible,.swatch:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.main{padding-block:16px 56px;display:flex;flex-direction:column;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.panel h2{margin:0 0 4px;font-size:16px;font-weight:600;text-wrap:balance;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.panel h3{margin:0;font-size:15px;font-weight:600}
.panel>p,.lead{margin:0 0 14px;color:var(--muted);max-width:72ch}
.fine{font-size:12.5px;color:var(--muted);margin:12px 0 0;max-width:86ch}
.btn{height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:500;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{background:var(--danger-soft);border-color:transparent;color:var(--danger)}
.btn.small{height:30px;padding:0 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.note{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:12px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.note.info{background:var(--accent-soft);border-color:transparent;color:var(--work-ink)}
.note.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.note.bad{background:var(--danger-soft);border-color:transparent;color:var(--danger)}
.note .grow{flex:1 1 280px;min-width:0}
.toolbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.brushes{display:flex;flex-wrap:wrap;gap:6px}
.brush{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 12px 0 6px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:500;cursor:pointer}
.brush[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.sw{min-width:24px;height:24px;padding:0 3px;border-radius:6px;display:inline-grid;place-items:center;font-size:11px;font-weight:600;position:relative;line-height:1}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.hint{font-size:13px;color:var(--muted);margin:0;max-width:120ch}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.stat{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:12.5px;font-weight:500;background:var(--surface-2);color:var(--ink-2)}
.stat::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.8}
.stat.good{background:var(--accent-soft);color:var(--work-ink)}
.stat.bad{background:var(--danger-soft);color:var(--danger)}
.stat.warn{background:var(--warn-soft);color:var(--warn)}
.c-work{background:var(--accent-soft);color:var(--work-ink)}
.c-night{background:var(--night-soft);color:var(--night)}
.c-leave{background:var(--leave-soft);color:var(--leave)}
.c-halfam{background:linear-gradient(90deg,var(--leave-soft) 0 50%,var(--accent-soft) 50% 100%);color:var(--leave)}
.c-halfpm{background:linear-gradient(90deg,var(--accent-soft) 0 50%,var(--leave-soft) 50% 100%);color:var(--leave)}
.c-halfnight{background:linear-gradient(90deg,var(--leave-soft) 0 50%,var(--night-soft) 50% 100%);color:var(--night)}
.c-otuse{background:var(--cu-violet-bg);color:var(--cu-violet-fg)}
.c-off{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.c-empty{background:transparent;color:var(--line)}
.c-blue{background:var(--cu-blue-bg);color:var(--cu-blue-fg)}.c-violet{background:var(--cu-violet-bg);color:var(--cu-violet-fg)}
.c-rose{background:var(--cu-rose-bg);color:var(--cu-rose-fg)}.c-cyan{background:var(--cu-cyan-bg);color:var(--cu-cyan-fg)}
.c-lime{background:var(--cu-lime-bg);color:var(--cu-lime-fg)}.c-slate{background:var(--cu-slate-bg);color:var(--cu-slate-fg)}
.c-pref{box-shadow:inset 0 0 0 1px var(--line)}
.c-pref::after,.k.rq::after{content:"";position:absolute;right:3px;top:3px;width:6px;height:6px;border-radius:50%;background:var(--pref)}
.c-auto{box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}
.k.lk::before,.c-lock::before{content:"";position:absolute;left:2px;top:2px;width:0;height:0;border-top:6px solid var(--ink-2);border-right:6px solid transparent;border-top-left-radius:2px}
.grid-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.grid{border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;user-select:none;-webkit-user-select:none}
.grid th,.grid td{padding:0;text-align:center;border-bottom:1px solid var(--line);font-weight:400}
.grid .name{position:sticky;left:0;z-index:2;background:var(--surface);text-align:left;padding:5px 12px;min-width:136px;max-width:176px;border-right:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid .name b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis}
.grid .name small{display:block;font-size:11px;color:var(--muted);line-height:1.3}
.grid thead th{background:var(--surface)}
.corner{vertical-align:bottom;font-size:12px;color:var(--muted)}
.dh{width:38px;min-width:38px;padding:7px 0 0;border-bottom:0!important}
.dn{display:block;font-size:13px;font-weight:600;line-height:1.2}
.dw{display:block;font-size:11px;color:var(--muted);line-height:1.3}
.sat .dn,.sat .dw,th.sat{color:var(--sat)}
.sun .dn,.sun .dw,th.sun{color:var(--sun)}
.dt{font-size:10px;height:20px;color:var(--muted);font-weight:500!important;letter-spacing:.02em}
.dt.hol{color:var(--sun)}.dt.nt{color:var(--night)}.dt.chg{color:var(--accent);font-weight:600!important}
td.c{padding:2px 3px}
.closed{background:repeating-linear-gradient(135deg,var(--hatch) 0 4px,transparent 4px 9px)}
.k{width:32px;height:30px;border:0;border-radius:7px;font:inherit;font-size:12px;font-weight:600;cursor:default;position:relative;display:grid;place-items:center;padding:0;letter-spacing:-.04em}
.k.ed{cursor:pointer;touch-action:pan-y}
.k.sm2{font-size:10.5px}
.k.um{box-shadow:inset 0 0 0 2px var(--pref)}
.k.sel{outline:2px solid var(--ink);outline-offset:-1px;z-index:1}
.k:focus-visible{outline:2px solid var(--accent);outline-offset:1px;z-index:1}
.sm{min-width:54px;padding:0 8px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.sm.first{border-left:1px solid var(--line)}
th.sm{font-size:11.5px;color:var(--muted);vertical-align:bottom;padding-bottom:6px;font-weight:500!important;line-height:1.3}
.sm.bad{color:var(--danger);font-weight:600}
.sm.warn{color:var(--warn);font-weight:600}
.grp th,.grp td{background:var(--surface-2);border-bottom:1px solid var(--line)}
.grp th{font-size:12px;font-weight:600!important;color:var(--ink-2);padding:5px 12px}
.grp th .mine{margin-left:6px}
.grp th span.ld{font-weight:400;color:var(--muted);margin-left:6px}
tfoot .name{font-size:12.5px;color:var(--ink-2)}
tfoot tr.gstart>*{border-top:2px solid var(--line)}
.cnt td{font-size:12px;height:26px;color:var(--ink-2)}
.cnt td.na{color:var(--line)}
.cnt td.short{background:var(--danger-soft);color:var(--danger);font-weight:600}
.cnt .name .ses{color:var(--muted);font-weight:400;margin-left:4px}
.cnt.tot td{font-weight:600;color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:12.5px;color:var(--muted)}
.legend>span{display:inline-flex;align-items:center;gap:6px}
.hatch-sw{width:22px;height:22px;border-radius:6px;border:1px solid var(--line)}
details.how{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
details.how summary{cursor:pointer;font-weight:500}
details.how ol{margin:10px 0 2px;padding-left:20px;color:var(--ink-2);max-width:96ch}
details.how li{margin:3px 0}
.tblwrap{overflow-x:auto;min-width:0}
.tbl{border-collapse:collapse;width:100%}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}
.tbl thead th{font-size:12px;color:var(--muted);font-weight:500}
.tbl tbody th{font-weight:600}
.tbl .num{font-variant-numeric:tabular-nums;color:var(--ink-2)}
.tbl td.desc{white-space:normal;color:var(--muted);font-size:13px;min-width:220px}
input[type=text],input[type=time],input[type=number],input[type=password],select{height:34px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;padding:0 8px;min-width:0}
input[type=number]{width:64px;font-variant-numeric:tabular-nums}
input[type=time]{width:112px;font-variant-numeric:tabular-nums}
input[type=text]{width:140px}
input.short{width:64px}
input.pin{width:130px;letter-spacing:.2em}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
input[disabled],select[disabled]{opacity:.45}
.wide-in{width:min(320px,100%)!important}
.tr{display:inline-flex;align-items:center;gap:6px}
.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer;margin-right:8px}
.chk input{width:16px;height:16px;accent-color:var(--accent)}
.days{display:flex;gap:4px}
.day{width:30px;height:30px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:inherit;font-size:12.5px;cursor:pointer}
.day.on{background:var(--accent-soft);color:var(--work-ink);border-color:transparent;font-weight:600}
.day.sat{color:var(--sat)}.day.sun{color:var(--sun)}
.swatches{display:flex;gap:4px}
.swatch{width:24px;height:24px;border-radius:6px;border:1px solid var(--line);cursor:pointer;padding:0}
.swatch[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:1px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex-wrap:wrap}
.seg button{height:34px;padding:0 14px;border:0;border-right:1px solid var(--line);background:var(--surface);color:var(--ink-2);font:inherit;font-weight:500;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;max-width:860px}
.calh{font-size:12px;color:var(--muted);text-align:center;padding-bottom:2px}
.calh.sun{color:var(--sun)}.calh.sat{color:var(--sat)}
.calc{min-height:70px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);font:inherit;text-align:left;padding:6px 7px;display:flex;flex-direction:column;gap:2px;cursor:pointer;min-width:0}
.calc .d{font-weight:600;font-variant-numeric:tabular-nums}
.calc.sun .d{color:var(--sun)}.calc.sat .d{color:var(--sat)}
.calc .tag{font-size:11px;line-height:1.3;color:var(--muted);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.calc.is-closed{background:repeating-linear-gradient(135deg,var(--hatch) 0 4px,transparent 4px 9px)}
.calc.is-closed .tag{color:var(--sun)}
.calc.is-custom{border-color:var(--accent)}
.calc.is-custom .tag{color:var(--accent);font-weight:500}
.calc.picked{outline:2px solid var(--ink);outline-offset:1px}
.calc.blank{visibility:hidden}
.dated{margin-top:14px;padding:14px;border-radius:10px;background:var(--surface-2);display:flex;flex-direction:column;gap:10px;max-width:860px}
.dated .muted{font-size:13px}
.chg-list{display:flex;flex-direction:column;gap:6px;margin-top:14px;max-width:860px}
.chg-list .row{justify-content:space-between;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.authpanel{max-width:440px;margin:28px auto;display:flex;flex-direction:column;gap:12px}
.authpanel input.pin{width:100%;height:44px;font-size:18px}

/* ---------- generator (one team at a time) ---------- */
function attempt(ctx){
  var team=ctx.team,staff=team.staff,ro=ctx.ro,cells={},cnt={},sat={},nC={};
  ctx.dates.forEach(function(iso){cnt[iso]=[0,0,0]});
  staff.forEach(function(p){cells[p.id]={};sat[p.id]=0;nC[p.id]=0;
    ctx.dates.forEach(function(iso){var d=di(iso),v;
      if(d.type==='closed'||absOf(p,iso))v='';else if(isLock(ro,p.id,iso))v=rawCode(ro,p.id,iso)||'O';else v=p.avail.indexOf(d.dow)>=0?'W':'O';
      cells[p.id][iso]=v;var q=pres(v,d,adjOf(ro,p,iso,v));cnt[iso][0]+=q[0];cnt[iso][1]+=q[1];cnt[iso][2]+=q[2]})});
  var halfElig=staff.filter(function(p){return p.avail.some(function(dw){return S.hours[dw].type==='half'})});
  function nightCap(iso){var c=0;staff.forEach(function(p){var v=cells[p.id][iso];if(p.night&&(v==='W'||isNightCode(v)))c++});return c}
  var R=ctx.R;
  function offScore(p,iso){var d=di(iso),v=Math.random()*4,need=needOf(team,d),q=pres('W',d,adjOf(ro,p,iso,'W')),a=cnt[iso][0]-q[0],b=cnt[iso][1]-q[1],short=0,sur=99;
    if(d.hasAM){short+=Math.max(0,need-a);sur=Math.min(sur,a-need)}
    if(d.hasPM){short+=Math.max(0,need-b);sur=Math.min(sur,b-need)}
    if(short)v-=1000*short;else v+=Math.min(sur,3)*6;
    if(gr(ro,p.id,iso)==='P')v+=400*R.pref;
    if(d.type==='half'&&halfElig.length){var avg=halfElig.reduce(function(s,x){return s+sat[x.id]},0)/halfElig.length;v+=(sat[p.id]-avg)*25*R.sat}
    if(d.night&&p.night&&nightCap(iso)-1<team.need.night)v-=600;
    var pv=cells[p.id][addDays(iso,-1)],nv=cells[p.id][addDays(iso,1)];if(pv==='O'||pv===''||nv==='O'||nv==='')v+=R.offAdj;
    if(R.run>0){var L=0,x=addDays(iso,-1);while(isWork(cells[p.id][x])){L++;x=addDays(x,-1)}var Rr=0;x=addDays(iso,1);while(isWork(cells[p.id][x])){Rr++;x=addDays(x,1)}if(L+1+Rr>S.rules.maxRun)v+=150*R.run}
    var gs=ctx.gOf[p.id];if(gs)gs.forEach(function(G){var ab=gAbs(G,iso,p.id,cells,ro);if((d.hasAM&&ab[0]+1>G.max)||(d.hasPM&&ab[1]+1>G.max))v-=1000});
    return v}
  ctx.weeks.forEach(function(w){var plans=[];
    staff.forEach(function(p){var Tp=weekTarget(p,w),tgt=Math.floor(Tp+1e-9);if(Math.random()<Tp-tgt-1e-9)tgt++;var fixed=0,cand=[];
      w.days.forEach(function(iso){var d=di(iso);if(d.type==='closed'||absOf(p,iso))return;
        if(isLock(ro,p.id,iso)){if(countsTarget(cells[p.id][iso]))fixed++}else if(p.avail.indexOf(d.dow)>=0)cand.push(iso)});
      var offs=Math.max(0,cand.length-Math.max(0,tgt-fixed));if(offs>0)plans.push({p:p,cand:cand,left:offs,r:Math.random()})});
    plans.sort(function(a,b){return (a.cand.length-a.left)-(b.cand.length-b.left)||a.r-b.r});
    var any=true;
    while(any){any=false;plans.forEach(function(pl){if(pl.left<=0)return;any=true;var best=null,bs=-Infinity;

      if(best===null){pl.left=0;return}var q=pres('W',di(best),adjOf(ro,pl.p,best,'W'));cnt[best][0]-=q[0];cnt[best][1]-=q[1];cells[pl.p.id][best]='O';pl.left--})}
    staff.forEach(function(p){w.days.forEach(function(iso){var d=di(iso);if(d.type==='half'&&isWork(cells[p.id][iso]))sat[p.id]++})})});
  ctx.dates.forEach(function(iso){var d=di(iso);if(!d.night||!team.need.night)return;var have=cnt[iso][2];
    var pool=staff.filter(function(p){return p.night&&cells[p.id][iso]==='W'&&!isLock(ro,p.id,iso)&&pres('N',d,adjOf(ro,p,iso,'N'))[2]}).map(function(p){return {p:p,k:nC[p.id]*R.night+Math.random()*0.9}});
    pool.sort(function(a,b){return a.k-b.k});
    for(var i=0;i<pool.length&&have<team.need.night;i++){var pp=pool[i].p,qw=pres('W',d,adjOf(ro,pp,iso,'W')),qn=pres('N',d,adjOf(ro,pp,iso,'N'));cells[pp.id][iso]='N';cnt[iso][0]+=qn[0]-qw[0];cnt[iso][1]+=qn[1]-qw[1];cnt[iso][2]+=qn[2]-qw[2];have=cnt[iso][2]}
    staff.forEach(function(p){if(isNightCode(cells[p.id][iso]))nC[p.id]++})});
  return {cells:cells,cnt:cnt,sat:sat,nC:nC}}
function evaluate(res,ctx){var team=ctx.team,staff=team.staff,ro=ctx.ro,R=ctx.R,short=0,unmet=0,over=0,tdev=0,fair=0,runs=0,lim=S.rules.maxWeekH*60;
  ctx.dates.forEach(function(iso){var d=di(iso);if(d.type==='closed')return;var need=needOf(team,d),c=res.cnt[iso];
    if(d.hasAM)short+=Math.max(0,need-c[0]);if(d.hasPM)short+=Math.max(0,need-c[1]);if(d.night)short+=Math.max(0,team.need.night-c[2])});
  staff.forEach(function(p){var rq=ro.reqs[p.id]||{};Object.keys(rq).forEach(function(iso){if(rq[iso]==='P'&&isWork(res.cells[p.id][iso]))unmet++})});
  function dev(a){if(a.length<2)return 0;var m=a.reduce(function(x,y){return x+y},0)/a.length;return a.reduce(function(x,y){return x+Math.abs(y-m)},0)}

  if(R.night)fair+=dev(staff.filter(function(p){return p.night}).map(function(p){return res.nC[p.id]}))*15*R.night;
  if(R.week)ctx.weeks.forEach(function(w){staff.forEach(function(p){var m=0;w.days.forEach(function(iso){var v=res.cells[p.id][iso];m+=mins(v,di(iso),adjOf(ro,p,iso,v))});if(m>lim)over++})});

  staff.forEach(function(p){var a=0;ctx.dates.forEach(function(iso){if(countsTarget(res.cells[p.id][iso]))a++});tdev+=Math.abs(a-ctx.tgt[p.id])});
  var gv=0;ctx.groups.forEach(function(G){ctx.dates.forEach(function(iso){if(di(iso).type==='closed')return;var ab=gAbs(G,iso,null,res.cells,ro);gv+=Math.max(0,ab[0]-G.max)+Math.max(0,ab[1]-G.max)})});

function ruleWeights(){var r=S.rules;return {pref:LV[r.pref],sat:LV[r.satFair],night:LV[r.nightFair],week:LV[r.maxWeek],run:LV[r.run],offAdj:r.offStyle==='together'?10:r.offStyle==='spread'?-10:0}}
function genTeam(ym,team){clearDI();var ro=roster(ym,team.id,true),ctx={team:team,ro:ro,dates:monthDates(ym),weeks:weeksOf(ym),tgt:{},R:ruleWeights()};ctx.groups=groupsFor(ym,team);ctx.gOf={};ctx.groups.forEach(function(G){G.mem.forEach(function(m){if(m.inTeam)(ctx.gOf[m.id]||(ctx.gOf[m.id]=[])).push(G)})});
  team.staff.forEach(function(p){ctx.tgt[p.id]=monthTarget(p,ym)});
  var best=null,bv=Infinity,n=EFFORT[S.rules.effort]||220;for(var i=0;i<n;i++){var r=attempt(ctx),v=evaluate(r,ctx);if(v<bv){bv=v;best=r}}
  var ids={};team.staff.forEach(function(p){ids[p.id]=1});Object.keys(ro.cells).forEach(function(k){if(!ids[k])delete ro.cells[k]});
  team.staff.forEach(function(p){var row={};ctx.dates.forEach(function(iso){var v=best.cells[p.id][iso];if(v)row[iso]=v});ro.cells[p.id]=row});
  ro.gen=true}

function stats(ym,teams){var dates=monthDates(ym),weeks=weeksOf(ym),per={},days={},T={shortDays:0,shortList:[],req:0,reqMet:0,over:0,wkOver:[],wkUnder:[],lim:(S.rules.maxWeek==='off'?52:S.rules.maxWeekH)*60};
  teams.forEach(function(team){var ro=roster(ym,team.id);
    team.staff.forEach(function(p){var tf=monthTarget(p,ym),o={work:0,half:0,night:0,leave:0,fixed:0,min:0,adj:0,maxW:0,tgt:Math.round(tf),tgtF:tf};
      dates.forEach(function(iso){var d=di(iso),v=cellCode(ro,p.id,iso);if(d.type==='closed'||absOf(p,iso))return;var a=adjOf(ro,p,iso,v),mn=mins(v,d,a);
        if(isWork(v)){o.work++;if(d.type==='half')o.half++}if(isNightCode(v)&&d.night)o.night++;o.leave+=leaveAmt(v);if(countsTarget(v))o.fixed++;
        o.min+=mn;if(a)o.adj+=mins(v,d,null)-mn;
        if(gr(ro,p.id,iso)==='P'){T.req++;if(v&&!isWork(v))T.reqMet++}});
      weeks.forEach(function(w){var m=0,n=0;w.days.forEach(function(iso){var v=cellCode(ro,p.id,iso);m+=mins(v,di(iso),adjOf(ro,p,iso,v));if(di(iso).type!=='closed'&&countsTarget(v))n++});if(m>o.maxW)o.maxW=m;
        if(w.days.length===7){var tg=weekTarget(p,w),it={p:p,mk:w.mk,n:n,t:tg};if(n>Math.ceil(tg-1e-9))T.wkOver.push(it);else if(n<Math.floor(tg+1e-9))T.wkUnder.push(it)}});
      if(o.maxW>T.lim)T.over++;per[p.id]=o})});
  dates.forEach(function(iso){var d=di(iso);if(d.type==='closed')return;var row={teams:{},tot:[0,0,0]},bad=[];
    teams.forEach(function(team){var ro=roster(ym,team.id),c=[0,0,0];team.staff.forEach(function(p){var v=cellCode(ro,p.id,iso),q=pres(v,d,adjOf(ro,p,iso,v));c[0]+=q[0];c[1]+=q[1];c[2]+=q[2]});
      var need=needOf(team,d),nn=d.night?team.need.night:0,x={c:c,need:need,nn:nn,sAM:d.hasAM&&c[0]<need,sPM:d.hasPM&&c[1]<need,sNT:d.night&&c[2]<nn};
      row.teams[team.id]=x;row.tot[0]+=c[0];row.tot[1]+=c[1];row.tot[2]+=c[2];
      if(team.staff.length&&(x.sAM||x.sPM||x.sNT))bad.push(team.name+' '+[x.sAM?'오전':'',x.sPM?'오후':'',x.sNT?'야간':''].filter(Boolean).join('·'))});
    days[iso]=row;if(bad.length){T.shortDays++;T.shortList.push(parts(iso)[1]+'/'+d.day+' '+bad.join(', '))}});
  return {per:per,days:days,T:T}}

  if(MODE==='server'){saveServer().then(function(){ui.saving=false;return loadData().then(function(){toast('저장했어요. 다른 사람도 ↻을 누르면 보여요. 실수했다면 위의 ‘되돌리기’로 저장 전으로 돌릴 수 있어요.');if(ui.histOpen)histLoad()})},function(r){ui.saving=false;

      else if(r&&r.error==='pin'){clearAuth();ui.auth=null;ui.dirty=freshDirty();ui.view='login';ui.loginErr='PIN이 바뀌었거나 팀장 등록이 삭제됐어요. 다시 로그인해 주세요.'}

      else if(r&&r.error)toast(errMsg(r));else ui.netErr='저장하지 못했어요. 인터넷 연결을 확인하고 다시 저장하세요.';
      render()});return}
  artP.then(function(a){var prev=S.savedAt;S.savedAt=Date.now();
    if(a){lsSet(KEYS.draft,JSON.stringify({at:S.savedAt,state:S}));stashUI({flash:'저장했어요'});
      return a.publish(buildDoc()).then(function(){ui.dirty=freshDirty()},function(e){ui.saving=false;S.savedAt=prev;ssDel(KEYS.ui);var c=e&&e.code;
        if(c==='conflict')toast('다른 곳에서 먼저 저장해서 최신 내용으로 다시 열려요.');
        else if(['not_writer','not_granted','consent_required','capability_disabled','not_declared','capability_removed'].indexOf(c)>=0){ui.ro=true;ui.preview='viewer';toast('이 화면은 보기 전용이라 저장할 수 없어요.')}

        else if(c==='too_large')toast('저장할 내용이 너무 커요. 오래된 달을 백업한 뒤 지워 주세요.');
        else toast('저장하지 못했어요. 잠시 뒤 다시 눌러 주세요.');render()})}
    var ok=lsSet(KEYS.saved,JSON.stringify(S));ui.saving=false;
    if(ok){lsDel(KEYS.draft);ui.dirty=freshDirty();toast('이 브라우저에 저장했어요. 여러 사람이 함께 쓰려면 구글 드라이브 서버를 연결하세요.')}else{S.savedAt=prev;toast('이 브라우저는 저장이 막혀 있어요. 전체 백업 파일로 받아 두세요.')}
    render()})}

    rows.push([team.name,p.name].concat(dates.map(function(iso){var d=di(iso);if(d.type==='closed')return d.ov?(d.ov.note||'휴진'):(d.hol||'휴진');if(absOf(p,iso))return p.abs.why||'휴직';var v=cellCode(ro,p.id,iso),c=isWork(v)&&ro.adj[p.id]&&ro.adj[p.id][iso];return v?TY[v].name+(c?' ('+adjLong(c)+')':''):''}),[o.work,o.tgt,o.half,o.night,fmtNum(o.leave),o.adj?hrs(o.adj):'',hrs(o.min),(p.late||p.early)?adjLong({e:p.early,l:p.late}):'']))})});

  teams.forEach(function(team){[['오전',0,'hasAM'],['오후',1,'hasPM'],['야간',2,'night']].forEach(function(s){rows.push([team.name,s[0]+' 인원'].concat(dates.map(function(iso){var x=st.days[iso],d=di(iso);return x&&d[s[2]]?x.teams[team.id].c[s[1]]:''})))})});
  return rows.map(function(r){return r.map(csvCell).join(',')}).join('\r\n')}
function printCal(ym){var teams=visibleTeams().filter(function(t){return t.staff.length}),dates=monthDates(ym),secs=calSections(ym,teams),Y=leaveIndex(ym.slice(0,4)),p=ym.split('-');
  var css='@page{size:A4 landscape;margin:7mm}*{box-sizing:border-box}body{font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#17211E;margin:10px;font-size:9.5px}'+

function printDoc(ym){var dates=monthDates(ym),teams=visibleTeams().filter(function(t){return t.staff.length}),st=stats(ym,teams);
  var colors={work:['#DCEEE7','#155240'],night:['#E3E5F6','#3B468E'],halfnight:['#E3E5F6','#3B468E'],otuse:['#ECE2F7','#5A3590'],leave:['#FAEDD2','#94600A'],halfam:['#FAEDD2','#94600A'],halfpm:['#FAEDD2','#94600A'],q1:['#FAEDD2','#94600A'],q2:['#FAEDD2','#94600A'],q3:['#FAEDD2','#94600A'],q4:['#FAEDD2','#94600A'],qn1:['#E3E5F6','#3B468E'],qn2:['#E3E5F6','#3B468E'],qn3:['#E3E5F6','#3B468E'],qn4:['#E3E5F6','#3B468E'],off:['#FFFFFF','#8A9590'],blue:['#DDE8FA','#1F4E9C'],violet:['#ECE2F7','#5A3590'],rose:['#F8DFE6','#982B4A'],cyan:['#D6EEF4','#105D70'],lime:['#E7EFD0','#4C5E12'],slate:['#E3E7EA','#3D4A55']};
